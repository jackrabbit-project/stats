<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2C6E49">
  <title>Compare hounds — ASFA Top 20</title>
  <meta name="description" content="Put two hounds side by side: Bowen points, Best of Breed, Best in Field, rank and standing within their breeds, from the 2026 ASFA Top 20 standings.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abel&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
</head>
<body class="min-h-screen flex flex-col">
  <header id="site-header"></header>

  <main id="main" class="flex-1 max-w-5xl mx-auto w-full px-4 py-6 space-y-6">
    <div>
      <h1 class="font-abel text-3xl text-asfa-green">Head to head</h1>
      <p class="text-sm text-asfa-text/70 mt-1">Pick two hounds. They do not have to be the same breed.</p>
    </div>

    <div class="grid md:grid-cols-2 gap-4">
      <div class="relative">
        <label for="search-a" class="block text-xs uppercase tracking-widest text-asfa-text/60 mb-1">Hound one</label>
        <input id="search-a" type="search" autocomplete="off" placeholder="Search by name…"
               class="w-full border border-asfa-border px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-asfa-green">
        <div id="results-a" class="search-results absolute z-20 left-0 right-0 mt-1 hidden"></div>
      </div>
      <div class="relative">
        <label for="search-b" class="block text-xs uppercase tracking-widest text-asfa-text/60 mb-1">Hound two</label>
        <input id="search-b" type="search" autocomplete="off" placeholder="Search by name…"
               class="w-full border border-asfa-border px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-asfa-green">
        <div id="results-b" class="search-results absolute z-20 left-0 right-0 mt-1 hidden"></div>
      </div>
    </div>

    <section id="panel"></section>
  </main>

  <footer id="site-footer" class="bg-asfa-navy text-white py-8"></footer>

  <script src="js/app.js"></script>
  <script>
    page('compare.html', (season) => {
      const panel = document.getElementById('panel');
      const byId = new Map(season.dogs.map((dog) => [dog.id, dog]));
      const picked = { a: byId.get(param('a')) || null, b: byId.get(param('b')) || null };

      /* A picker is the shared search box plus a click handler that selects
         rather than navigates. */
      function wire(slot, inputId, resultsId) {
        const input = document.getElementById(inputId);
        const results = document.getElementById(resultsId);

        const render = () => {
          const matches = searchDogs(input.value, season.dogs, 12);
          if (!matches.length) {
            results.classList.add('hidden');
            results.innerHTML = '';
            return;
          }
          results.classList.remove('hidden');
          results.innerHTML = matches.map((dog) => `
            <button type="button" data-id="${esc(dog.id)}"
              class="w-full text-left flex items-baseline gap-3 px-3 py-2 hover:bg-asfa-bg2 border-b border-asfa-border last:border-0">
              <span class="font-semibold text-asfa-green">${esc(dog.call_name)}</span>
              <span class="text-sm text-asfa-text/70 truncate flex-1">${esc(dog.registered_name)}</span>
              <span class="text-xs text-asfa-accent whitespace-nowrap">${esc(dog.breed)} #${dog.rank}</span>
            </button>`).join('');

          results.querySelectorAll('button[data-id]').forEach((button) => {
            button.addEventListener('click', () => {
              picked[slot] = byId.get(button.dataset.id);
              input.value = picked[slot].call_name;
              results.classList.add('hidden');
              sync();
            });
          });
        };

        input.addEventListener('input', render);
        input.addEventListener('focus', render);
        document.addEventListener('click', (event) => {
          if (!results.contains(event.target) && event.target !== input) {
            results.classList.add('hidden');
          }
        });

        if (picked[slot]) input.value = picked[slot].call_name;
      }

      function sync() {
        const url = new URL(window.location);
        for (const slot of ['a', 'b']) {
          if (picked[slot]) url.searchParams.set(slot, picked[slot].id);
          else url.searchParams.delete(slot);
        }
        history.replaceState(null, '', url);
        paint();
      }

      function paint() {
        const { a, b } = picked;
        if (!a || !b) {
          panel.innerHTML = `<div class="card"><p class="text-sm text-asfa-text/70">
            Choose ${!a && !b ? 'two hounds' : 'one more hound'} to see them side by side.</p></div>`;
          return;
        }

        const sameBreed = a.breed_slug === b.breed_slug;

        // Lower is better for rank and percentile; higher is better for the rest.
        const rows = [
          ['Breed', esc(a.breed), esc(b.breed), null],
          ['Rank in breed', `#${a.rank}`, `#${b.rank}`, sameBreed ? (b.rank - a.rank) : null],
          ['Breed standing', percentileLabel(a), percentileLabel(b),
            (a.percentile != null && b.percentile != null) ? (b.percentile - a.percentile) : null],
          ['Hounds competing', a.total_competing ?? '—', b.total_competing ?? '—', null],
          ['Top 20 points', a.points, b.points, sameBreed ? (a.points - b.points) : null],
          ['Best of Breed', a.bob, b.bob, a.bob - b.bob],
          ['Best in Field', a.bif, b.bif, a.bif - b.bif],
          ['Region', a.region ?? '—', b.region ?? '—', null],
          ['Owner', esc(a.owner_raw), esc(b.owner_raw), null],
        ];

        const head = (dog) => `
          <div class="text-center">
            <div class="rank-pill">#${dog.rank}</div>
            <a href="${dogUrl(dog.id)}" class="block font-abel text-2xl text-asfa-green mt-1 hover:text-asfa-accent">${esc(dog.call_name)}</a>
            <p class="text-xs text-asfa-text/70 mt-1">${esc(dog.registered_name)}</p>
          </div>`;

        panel.innerHTML = `
          <div class="card">
            <div class="grid grid-cols-2 gap-4 pb-4 border-b border-asfa-border">
              ${head(a)}${head(b)}
            </div>
            <table class="tbl mt-4">
              <tbody>
                ${rows.map(([label, left, right, edge]) => {
                  const leftWins = edge != null && edge > 0;
                  const rightWins = edge != null && edge < 0;
                  return `<tr>
                    <td class="num w-1/3 ${leftWins ? 'font-semibold text-asfa-accent' : ''}">${left}</td>
                    <td class="text-center text-xs uppercase tracking-widest text-asfa-text/60 whitespace-nowrap">${label}</td>
                    <td class="w-1/3 ${rightWins ? 'font-semibold text-asfa-accent' : ''}">${right}</td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
            ${sameBreed ? '' : `
              <p class="text-xs text-asfa-text/65 mt-4 border-t border-asfa-border pt-3">
                These hounds run in different breeds, so their point totals are not comparable —
                a breed with 200 hounds competing offers far more points than one with five.
                Breed standing and Best in Field are the columns that compare fairly.
              </p>`}
          </div>`;
      }

      wire('a', 'search-a', 'results-a');
      wire('b', 'search-b', 'results-b');
      paint();
    });
  </script>
</body>
</html>
