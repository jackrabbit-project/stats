  <meta property="og:description" content="Continental Whippet Alliance whippets: grade, average, the last three meets and progress toward every title, with CWA's standings and title holders. Unofficial; CWA's own records govern.">
  <meta property="og:url" content="https://stats.gazehound.io/cwa.html">

<body class="min-h-screen flex flex-col">
  <header id="site-header"></header>
  <main id="main" class="flex-1 max-w-6xl mx-auto w-full px-4 py-6 space-y-8"></main>
  <footer id="site-footer" class="bg-asfa-navy text-white py-8"></footer>

  <script src="js/app.js?v=20261030b"></script>
  <script src="js/racing.js?v=20261030a"></script>
  <script>
    /* CWA in the Whippet racing section (beta). The whippets are CWA's
       grading guides, keyed by CWA number: the current guide in
       data/cwa.json, the archived guide and the whippets found only on
       CWA's lists in data/cwa-registry.json, loaded when asked for. Around
       them, CWA's standings, its all-time top race whippets and its title
       lists. ?dog=<id> shows one whippet. Built by tools/cwa.py; the bars
       and badges come from js/racing.js. */
    pageFeed('cwa.html', 'cwa', 'data/cwa.json', render);

    function render(feed) {
      const main = document.getElementById('main');
      const { stats } = feed;
      const n = (v) => (v == null ? '—' : Number(v).toLocaleString('en-US'));
      const shortDate = (iso) => new Date(`${iso}T00:00:00Z`).toLocaleDateString('en-US',
        { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
      const when = (row) => (row.earned ? shortDate(row.earned) : row.year ? String(row.year) : '—');
      const external = (href, text) =>
        `<a href="${esc(href)}" class="lnk" target="_blank" rel="noopener noreferrer">${text}</a>`;
      const unpack = (columns, row) => Object.fromEntries(columns.map((col, i) => [col, row[i]]));
      const whippets = feed.whippets.map((row) => unpack(feed.whippet_columns, row));
      const byId = new Map(whippets.map((w) => [w.id, w]));
      const titles = feed.titles.map((row) => unpack(feed.title_columns, row));
      const bases = Object.keys(feed.title_names);
      const titlesOf = (id) => titles.filter((row) => row.dog === id)
        .sort((a, b) => (a.year || 0) - (b.year || 0) || (a.earned || '').localeCompare(b.earned || ''));
      const titledIds = new Set(titles.filter((row) => !row.status).map((row) => row.dog));
      const DUAL = ['DPC', 'DPCX', 'HC', 'HCX'];
      const titleBadge = (row) => `<span class="badge ${DUAL.includes(row.base) ? 'badge-t-lcm' : 'badge-t-tcp'} normal-case"
        title="${esc(feed.title_names[row.base] || row.base)}">${esc(row.title)}</span>${
        row.status === 'ineligible' ? ' <span class="badge badge-flat" title="CWA lists this whippet as ineligible for the title">ineligible</span>' : ''}`;
      const callName = (w) => w.call_name || w.registered_name || w.name;
      const dogLink = (id, text) => `<a href="cwa.html?dog=${encodeURIComponent(id)}" class="lnk font-semibold">${esc(text)}</a>`;
      const racing = feed.standings.racing;
      const hc = feed.standings.high_combined;
      const chartNote = (chart) => `As of ${formatDate(chart.as_of)}${chart.meets ? `, after ${chart.meets} race meets` : ''}; ties share a place.`;
      const CWA_BANDS = [[5, 'C'], [10, 'B'], [15, 'A']];
      const bandOf = (avg) => (avg == null ? null : avg >= 15 ? 'A' : avg >= 10 ? 'B' : avg >= 5 ? 'C' : 'D');
      const gradeOf = (w) => (!w.grade ? '' : w.grade === 'FTE'
        ? '<span class="badge badge-flat" title="First time entered">FTE</span>' : gradeBadge(w.grade));
      const lastRaced = (w) => (w.last_raced ? shortDate(w.last_raced) : w.year_last_run ? String(w.year_last_run)
        : w.never_raced ? 'not yet' : '—');
      const prThrough = (w) => (w.on === 'current' && stats.pr_as_of ? ` through ${formatDate(stats.pr_as_of)}` : '');
      // Owners as the guide prints them, split at each "/". Each links to its
      // kennel: Browse filtered to that owner, with the archived guide loaded
      // when the link comes from an archived whippet.
      const ownersOf = (w) => (w.owner_raw || '').split('/').map((part) => part.trim()).filter(Boolean);
      const ownerUrl = (owner, archive) =>
        `cwa.html?owner=${encodeURIComponent(owner)}${archive ? '&archive=1' : ''}#browse`;
      // A whippet's owners as its guide prints them, each a link to its kennel.
      const guideOwners = (w) => linkOwners(w.owner_raw,
        ownersOf(w).map((name) => ({ name, href: ownerUrl(name, w.on === 'archive') })));
      // An owner on one of CWA's lists links straight to its kennel when the
      // current guide carries the name; otherwise the kennel opens with the
      // archived guide loaded.
      const currentOwners = new Set(whippets.flatMap(ownersOf));
      const listOwners = (text) => linkOwners(text, (text || '').split('/').map((part) => part.trim()).filter(Boolean)
        .map((name) => ({ name, href: ownerUrl(name, !currentOwners.has(name)) })));

      document.title = 'CWA whippet racing — Gazehound Stats';

      /* ============================================== one whippet (?dog=) */
      const NARX_STEPS = [[15, 'NARX'], [30, 'NARX2'], [45, 'NARX3'], [60, 'NARX4'],
        [75, 'SRA'], [150, 'SRA2'], [225, 'SRA3'], [300, 'SRA4']];
      const PR_STEPS = [[50, 'PR'], [150, 'PR2'], [250, 'PR3'], [350, 'PR4'], [450, 'PRX']];
      const LEVEL_NAMES = { NARX: 'National Award of Racing Excellence', SRA: 'Superior Racing Award',
        HC: 'High Combined', HCX: 'High Combined Excellent', PR: 'Performance Racer', PRX: 'Performance Racer Excellence' };
      const levelName = (code) => LEVEL_NAMES[code.replace(/[0-9]+$/, '')] || code;
      // HCX goes on in steps of five wins, with no top level.
      const hcSteps = (value) => {
        const steps = [[5, 'HC'], [10, 'HCX']];
        for (let level = 2; 10 + 5 * (level - 1) <= (value || 0) + 5; level += 1) steps.push([10 + 5 * (level - 1), `HCX${level}`]);
        return steps;
      };
      const earnedBar = (label, note) => `
        <div class="mt-3">
          <div class="flex justify-between text-sm"><span class="font-semibold">${label}</span><span class="text-asfa-text/70">earned</span></div>
          ${note ? `<p class="text-xs text-asfa-text/60">${note}</p>` : ''}
          <div class="h-2 bg-asfa-bg2 border border-asfa-border mt-1" role="img" aria-label="${label}: earned">
            <div class="h-full bg-asfa-green" style="width:100%"></div>
          </div>
        </div>`;
      // A ladder of levels (NARX to SRA4, PR to PRX, HC to HCX and on): the
      // bar runs to the next mark, or shows the top one reached.
      const ladderBar = (value, steps, note) => {
        const v = value || 0;
        let held = null;
        steps.forEach((step) => { if (v >= step[0]) held = step; });
        const next = steps.find(([need]) => v < need);
        if (!next) return progressBar(v, held[0], `${held[1]} · ${levelName(held[1])}`, { done: true, note });
        const passed = held ? ` Past the ${held[1]} mark.` : '';
        return progressBar(v, next[0], `${next[1]} · ${levelName(next[1])}`, { done: false, note: `${note}${passed}` });
      };

      const wantedId = param('dog');
      if (wantedId) {
        const draw = (w, lookup = byId) => {
          main.innerHTML = whippetPage(w, lookup);
          if (typeof fitTables === 'function') fitTables();
        };
        if (byId.has(wantedId)) { draw(byId.get(wantedId)); return; }
        main.innerHTML = `<div class="card"><p class="text-sm text-asfa-text/70">Looking up ${esc(wantedId)} in CWA's archived guide…</p></div>`;
        loadRegistry('cwa').then((rows) => {
          const found = rows.find((w) => w.id === wantedId);
          // The archive loaded, a whippet's page can name the other rows on its number.
          if (found) { draw(found, new Map([...rows.map((x) => [x.id, x]), ...byId])); return; }
          main.innerHTML = `<div class="card"><h1 class="card-title">Whippet not found</h1>
            <p class="text-sm">No whippet on CWA's grading guides or lists matches <code>${esc(wantedId)}</code>.</p>
            <p class="text-sm mt-2"><a href="cwa.html#browse" class="lnk">Browse CWA's whippets →</a></p></div>`;
        }).catch((error) => {
          console.error(error);
          showFailure('Whippet unavailable', `Could not load data/cwa-registry.json: ${esc(error.message)}`, 'Try again in a moment.');
        });
        return;
      }

      function whippetPage(w, lookup) {
        const mine = titlesOf(w.id);
        const listOnly = w.on === 'lists';
        const current = w.on === 'current';
        document.title = `${callName(w)} — CWA — Gazehound Stats`;
        const latest = {};
        mine.filter((row) => !row.status).forEach((row) => { latest[row.base] = row; });
        const badges = bases.filter((base) => latest[base]).map((base) => titleBadge(latest[base])).join(' ');
        const r = racing.rows.find((row) => row.dog === w.id);
        const h = hc.rows.find((row) => row.dog === w.id);
        const a = feed.all_time.rows.find((row) => row.dog === w.id);
        const standingLines = [
          r ? `Racing standings: <strong>#${r.place}</strong> on ${ptsLabel(r.points)} NARX points this year, as of ${formatDate(racing.as_of)}.` : '',
          h ? `High Combined: <strong>#${h.place}</strong> on ${ptsLabel(h.points)} wins this year, as of ${formatDate(hc.as_of)}.` : '',
          a ? `All-time top race whippets: <strong>#${a.place}</strong> on ${ptsLabel(a.points)} NARX points, ${esc(feed.all_time.period)}.` : '',
        ].filter(Boolean);
        const where = current
          ? `On CWA's current grading guide, updated ${formatDate(stats.guide_updated)}.`
          : w.on === 'archive'
            ? `On CWA's archived grading guide${w.year_last_run ? `; last ran in ${w.year_last_run}` : ''}.`
            : `Found on CWA's title or standings lists only, not on either grading guide.`;
        // A number on more than one row: sometimes one whippet listed twice,
        // sometimes two whippets. Each row is shown as CWA lists it.
        const partners = [w.duplicate_of ? lookup.get(w.duplicate_of) : null,
          ...[...lookup.values()].filter((x) => x.duplicate_of === w.id)].filter(Boolean);
        const shared = partners.length
          ? ` CWA No. ${esc(w.cwa_no)} is on ${partners.length === 1 ? 'another row' : 'other rows'} of CWA's guides too: ${partners.map((x) =>
            `${dogLink(x.id, callName(x))}${x.on === 'current' ? ' (current guide)' : x.year_last_run ? ` (last ran ${x.year_last_run})` : ''}`).join(', ')}.` : '';

        /* ----- progress toward each title, by CWA's rules */
        const bars = [];
        if (!listOnly) {
          const arxDone = w.arx_status === 'ARX';
          bars.push(arxDone
            ? earnedBar('ARX · Award of Racing Excellence', 'The guide marks it ARX.')
            : progressBar(w.arx_points || 0, 15, 'ARX · Award of Racing Excellence',
              { done: false, note: 'ARX points go to the top finishers without the title at each meet, by the number of adult starters.' }));
          const narxNote = 'Career NARX points, from the top finishers at each meet. CWA tabulates NARX titles at the end of each calendar year.';
          const sraNext = (w.narx || 0) >= 60 && (w.narx || 0) < 300 && !arxDone ? ' The SRA also needs an ARX.' : '';
          bars.push(ladderBar(w.narx, NARX_STEPS, `${narxNote}${sraNext}`));
          bars.push(w.trp_status
            ? earnedBar('TRP · Title of Racing Proficiency', `On the guide as ${esc(w.trp_status)}.`)
            : progressBar(w.trp_meets || 0, 10, 'TRP · Title of Racing Proficiency',
              { done: false, note: 'Adult meets completed in full: all four programs, with no disqualification, did-not-finish or scratch.' }));
          if (w.dpc_status === 'DPC' || w.dpc_status === 'DPCX') {
            bars.push(earnedBar(`${w.dpc_status} · ${feed.title_names[w.dpc_status]}`,
              `The guide's DPC column shows ${w.dpc_status}.${w.dpc_status === 'DPC' && !arxDone ? ' The DPCX needs an ARX as well.' : ''}`));
          } else if (w.dpc_status === 'CH') {
            bars.push(`
              <div class="mt-3">
                <div class="flex justify-between text-sm"><span class="font-semibold">DPC · Dual Purpose Champion</span><span class="text-asfa-text/70">conformation half met</span></div>
                <p class="text-xs text-asfa-text/60">The guide's DPC column shows CH: an AKC or CKC bench championship, which stands in for the 15 conformation points. The DPC also needs a TRP, the DPCX an ARX.</p>
              </div>`);
          } else {
            bars.push(progressBar(w.dpc_points || 0, 15, 'DPC · Dual Purpose Champion',
              { done: false, note: 'CWA conformation points, or an AKC or CKC bench championship in their place. The DPC also needs a TRP, the DPCX an ARX.' }));
          }
          bars.push(ladderBar(w.hc, hcSteps(w.hc), 'High Combined wins: the racing and conformation placements at a meet, added together.'));
          bars.push(ladderBar(w.pr_points, PR_STEPS,
            `Career race points${prThrough(w)}. CWA adds a year's race points to the guide at its end.`));
        }

        const meets = w.meets || [];
        const MEET_NAMES = ['Last meet', '2nd last meet', '3rd last meet'];
        const listed = meets.map(([, , points]) => points).filter((v) => v != null);
        const arithmetic = listed.length > 1
          ? `(${listed.map(ptsLabel).join(' + ')}) ÷ ${listed.length} = ${waveLabel(listed.reduce((s, v) => s + v, 0) / listed.length)}`
          : listed.length ? `one meet, ${ptsLabel(listed[0])} points` : '';
        const band = bandOf(w.avg);
        const tiles = listOnly ? [] : [
          [waveLabel(w.avg), 'average'],
          [ptsLabel(w.narx || 0), 'NARX points'],
          [ptsLabel(w.pr_points || 0), current && stats.pr_as_of ? `race points to ${shortDate(stats.pr_as_of)}` : 'race points'],
          [lastRaced(w), current ? 'last raced' : 'last ran'],
        ];
        return `
          <nav class="text-sm text-asfa-text/70"><a href="cwa.html" class="lnk">CWA</a> › <a href="cwa.html#browse" class="lnk">Whippets</a></nav>
          <section class="card">
            <div class="flex flex-wrap items-start gap-4">
              ${listOnly ? '' : `<div class="text-center shrink-0 w-24">
                <div class="rank-pill">${esc(w.grade || '—')}</div>
                <div class="text-xs uppercase tracking-widest text-asfa-text/60 mt-1">grade</div>
              </div>`}
              <div class="flex-1 min-w-[16rem]">
                <h1 class="font-display text-3xl text-asfa-text leading-tight">${esc(callName(w))}</h1>
                ${w.call_name ? `<p class="text-asfa-text/85">${esc(w.registered_name || w.name)}</p>` : ''}
                ${badges ? `<p class="text-xs text-asfa-text/70 mt-1">CWA titles on record: ${badges}</p>` : ''}
                <p class="text-sm text-asfa-text/70 mt-1">Whippet${w.cwa_no ? ` · CWA No. <span class="font-mono text-xs">${esc(w.cwa_no)}</span>` : ''}${
                  w.on === 'archive' ? ' · <span class="badge badge-flat">archived guide</span>' : ''}</p>
                ${w.owner_raw ? `<p class="text-sm mt-1">Owned by ${guideOwners(w)}</p>` : ''}
                <p class="text-xs text-asfa-text/65 mt-1">${where}${shared}</p>
              </div>
            </div>
            ${tiles.length ? `<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-5">${tiles.map(([value, label]) =>
              `<div class="tile"><div class="tile-value">${value}</div><div class="tile-label">${label}</div></div>`).join('')}</div>` : ''}
          </section>
          ${standingLines.length ? `
          <section class="card">
            <h2 class="card-title">Standing</h2>
            <div class="text-sm space-y-1">${standingLines.map((line) => `<p>${line}</p>`).join('')}</div>
          </section>` : ''}
          ${listOnly ? '' : `
          <section class="card">
            <div class="flex flex-wrap items-baseline gap-3">
              <h2 class="card-title mb-0">Average</h2>
              <span class="font-display text-3xl text-asfa-accent">${waveLabel(w.avg)}</span>
              ${gradeOf(w)}
            </div>
            ${waveBar(w.avg, 29, CWA_BANDS, 'Average')}
            ${arithmetic ? `<p class="text-sm text-asfa-text/80">From the meets below: ${arithmetic}.</p>` : ''}
            ${listed.length && w.avg_computed != null && Math.abs(w.avg - w.avg_computed) > 0.01
              ? `<p class="text-xs text-asfa-text/65 mt-2">The guide prints ${waveLabel(w.avg)}; its meets work out to ${waveLabel(w.avg_computed)}. The guide's figure is the one shown.</p>` : ''}
            ${w.grade === 'FTE' && !meets.length ? '<p class="text-sm text-asfa-text/80">First time entered: no adult meet completed yet, so the whippet starts in grade D unless it holds a grade from another racing body.</p>' : ''}
            ${['A', 'B', 'C', 'D'].includes(w.grade) && meets.length && band && band !== w.grade
              ? `<p class="text-xs text-asfa-text/65 mt-2">The guide grades this whippet ${w.grade}; its average falls in ${band}. CWA drops a whippet one grade after a year without racing.</p>` : ''}
            <p class="text-xs text-asfa-text/60 mt-2">Grades: A 15 to 29, B 10 to 14.9, C 5 to 9.9, D below 5. <a href="cwa.html#about" class="lnk">How CWA grades</a>.</p>
          </section>
          <section class="card">
            <h2 class="card-title">Progress toward titles</h2>
            <p class="text-xs text-asfa-text/60">Read from CWA's grading guide; CWA's Statistician certifies each title.</p>
            ${bars.join('')}
          </section>
          <section class="card">
            <h2 class="card-title">Last three meets</h2>
            ${meets.length ? `
            <div class="tbl-wrap"><table class="tbl">
              <thead><tr><th scope="col">Meet</th><th scope="col">State</th><th scope="col" class="num">Points</th></tr></thead>
              <tbody>${meets.map(([date, state, points], i) => `
                <tr><td class="whitespace-nowrap">${date ? formatDateShort(date) : MEET_NAMES[i]}</td>
                    <td>${esc(state || '—')}</td>
                    <td class="num font-semibold">${ptsLabel(points)}</td></tr>`).join('')}</tbody>
            </table></div>
            <p class="text-xs text-asfa-text/65 mt-2">The last three meets completed, newest first; the average rests on them.${
              !meets.some(([date]) => !date) ? '' : w.on === 'archive' ? ' The archived guide gives the state of each meet but not its date.'
                : ' The guide gives no date for a meet listed by its state alone.'}</p>`
            : '<p class="text-sm text-asfa-text/70">No meets listed.</p>'}
          </section>
          <section class="card">
            <h2 class="card-title">Disqualifications</h2>
            ${w.dq ? `<p class="text-sm">${ptsLabel(w.dq)} on record${w.dq_date ? (w.dq_date[0]
              ? `, the latest ${formatDateShort(w.dq_date[0])}${w.dq_date[1] ? `, ${esc(w.dq_date[1])}` : ''}`
              : ` (the guide's DQ date reads ${esc(w.dq_date[1])})`) : ''}.</p>`
              : '<p class="text-sm text-asfa-text/70">None recorded.</p>'}
          </section>`}
          <section class="card">
            <h2 class="card-title">CWA titles</h2>
            ${mine.length ? `
            <div class="tbl-wrap"><table class="tbl">
              <thead><tr><th scope="col">Title</th><th scope="col">Earned</th><th scope="col">Name as the list prints it</th></tr></thead>
              <tbody>${mine.map((row) => `
                <tr><td class="whitespace-nowrap">${titleBadge(row)}</td><td class="whitespace-nowrap">${when(row)}</td>
                    <td class="text-asfa-text/80">${esc(row.name)}</td></tr>`).join('')}</tbody>
            </table></div>` : `<p class="text-sm text-asfa-text/70">None on CWA's title lists.</p>`}
          </section>
          <p class="text-xs text-asfa-text/55">
            Figures as published in CWA's ${w.on === 'archive' ? external(feed.archive_url, 'archived grading guide')
              : listOnly ? 'lists' : `${external(feed.guide_url, 'grading guide')} of ${formatDate(stats.guide_updated)}`}${
              listOnly ? '' : ' and its title lists'}.
            <a href="cwa.html#about" class="lnk">What the columns mean</a>.
          </p>`;
      }

      /* ===================================================== the CWA pages */
      const awarded = titles.filter((row) => !row.status);
      const newest = awarded.filter((row) => row.earned).slice(0, 10);
      const years = [...new Set(titles.map((row) => row.year).filter(Boolean))].sort((a, b) => b - a);
      const grades = stats.grades_current || {};
      const tiles = [
        [n(stats.raced_this_year), `whippets racing in ${stats.season}`],
        [n(stats.titles_this_year), `titles earned in ${stats.season}`],
        [n(stats.arx_total), 'ARX titles, all time'],
        [n(stats.trp_total), 'TRP titles, all time'],
        [n(stats.dpc_total), 'DPC titles, all time'],
      ];
      const standingsTable = (chart, unit, full) => `
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th scope="col" class="num">Place</th><th scope="col">Whippet</th>${
            full ? '<th scope="col">Registered name</th><th scope="col">Owners</th>' : ''}<th scope="col" class="num">${unit}</th></tr></thead>
          <tbody>${chart.rows.map((row) => `
            <tr>
              <td class="num font-semibold">${row.place}</td>
              <td>${dogLink(row.dog, row.call_name)}</td>
              ${full ? `<td class="text-asfa-text/80">${esc(row.registered_name)}</td><td class="text-asfa-text/80">${listOwners(row.owners)}</td>` : ''}

      const GRADE_ORDER = { A: 1, B: 2, C: 3, D: 4, FTE: 5 };
      const sort = { key: 'avg', dir: -1 };
      const valueOf = (w, key) => {
        if (key === 'call_name') return callName(w);
        if (key === 'registered_name') return w.registered_name || w.name;
        if (key === 'grade') return GRADE_ORDER[w.grade] || null;
        if (key === 'arx') return w.arx_status ? 1000 : w.arx_points;
        if (key === 'trp') return w.trp_status ? 1000 + (Number(w.trp_status.replace(/[^0-9]/g, '')) || 0) : w.trp_meets;
        if (key === 'last_raced') return w.last_raced || (w.year_last_run ? String(w.year_last_run) : null);
        return w[key];

        const year = Number(yearFilter.value) || null;
        const needle = nameFilter.value.trim().toLowerCase();
        const rows = titles.filter((row) => (!base || row.base === base) && (!year || row.year === year)
          && (!needle || row.name.toLowerCase().includes(needle)));
        const shown = showAllTitles ? rows : rows.slice(0, 100);
        titlesCount.textContent = `${n(rows.length)} of ${n(titles.length)} rows${
          rows.length > shown.length ? `, the newest ${shown.length} shown` : ''}.`;
        titlesTable.innerHTML = rows.length ? `
          <div class="tbl-wrap"><table class="tbl">
            <thead><tr><th scope="col">Earned</th><th scope="col">Title</th><th scope="col">Whippet</th><th scope="col">Owners</th></tr></thead>
            <tbody>${shown.map((row) => `
              <tr>
                <td class="whitespace-nowrap">${when(row)}</td>
                <td class="whitespace-nowrap">${titleBadge(row)}</td>
                <td>${dogLink(row.dog, row.name)}</td>
                <td class="text-asfa-text/80">${row.owners ? listOwners(row.owners) : '—'}</td>
              </tr>`).join('')}</tbody>
          </table></div>
          ${rows.length > shown.length ? `<p class="text-sm mt-3 no-print"><button type="button" id="titles-all" class="lnk">Show all ${n(rows.length)}</button></p>` : ''}`
          : '<p class="text-sm text-asfa-text/70">No title matches those choices.</p>';
        const more = document.getElementById('titles-all');
        if (more) more.addEventListener('click', () => { showAllTitles = true; paintTitles(); });
        if (typeof fitTables === 'function') fitTables();
      }
      [titleFilter, yearFilter].forEach((el) => el.addEventListener('change', () => { showAllTitles = false; paintTitles(); }));
      nameFilter.addEventListener('input', () => { showAllTitles = false; paintTitles(); });
      window.addEventListener('beforeprint', () => { showAllTitles = true; paintTitles(); });
      paintTitles();

      /* ----- tabs, by the hash, as on the other whippet pages */
      const ids = TABS.map(([id]) => id);
      function showTab() {
        const asked = window.location.hash.slice(1);
        const tab = ids.includes(asked) ? asked : 'overview';
        ids.forEach((id) => document.getElementById(id).classList.toggle('hidden', id !== tab));
        document.querySelectorAll('#sub-tabs a[data-tab]').forEach((link) => {
          const on = link.dataset.tab === tab;
          link.classList.toggle('tab-active', on);
          if (on) link.setAttribute('aria-current', 'page');
          else link.removeAttribute('aria-current');
        });
        setTimeout(() => window.scrollTo({ top: 0, behavior: 'instant' }), 0);
        if (typeof fitTables === 'function') fitTables();
      }
      showTab();
      window.addEventListener('hashchange', showTab);
    }
  </script>
</body>
</html>
