<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F5EF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B1917">
  <title>Regions — Lure Coursing Stats</title>
  <meta name="description" content="ASFA lure coursing by region: Top 20 hounds, Bowen points, Best of Breed and Best in Field per region, plus which regions and clubs are drawing the most trial entries in 2026.">
  <link rel="canonical" href="https://stats.gazehound.io/regions.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Lure Coursing Stats">
  <meta property="og:title" content="Regions — Lure Coursing Stats">
  <meta property="og:description" content="ASFA lure coursing by region: Top 20 hounds, Bowen points, Best of Breed and Best in Field per region, plus which regions and clubs are drawing the most trial entries in 2026.">
  <meta property="og:url" content="https://stats.gazehound.io/regions.html">
  <meta property="og:image" content="https://stats.gazehound.io/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="assets/fonts/fraunces-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <script src="js/theme.js?v=20260823"></script>
  <link rel="stylesheet" href="css/app.css?v=20260823b">
  <link rel="icon" href="assets/favicon.ico?v=3" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=3">
</head>
<body class="min-h-screen flex flex-col">
  <header id="site-header"></header>
  <main id="main" class="flex-1 max-w-6xl mx-auto w-full px-4 py-6 space-y-6"></main>
  <footer id="site-footer" class="bg-asfa-navy text-white py-8"></footer>

  <script src="js/app.js?v=20260827a"></script>
  <script>
    page('regions.html', (season) => {
      const main = document.getElementById('main');

      const header = `
        <div>
          <h1 class="font-display text-3xl text-asfa-text">Regions</h1>
          <p class="text-sm text-asfa-text/70 mt-1">
            ASFA divides the country into ten regions, each with an elected Regional Director.
            See <a href="https://www.asfa.org/clubs/index.htm" class="lnk" target="_blank" rel="noopener noreferrer">ASFA's club directory</a>
            for the member clubs in each one.
          </p>
        </div>`;

      const standings = () => {
        const rows = season.regions;
        const totals = rows.reduce((acc, r) => ({
          hounds: acc.hounds + r.hounds, bob: acc.bob + r.bob,
          bif: acc.bif + r.bif, firsts: acc.firsts + r.firsts,
        }), { hounds: 0, bob: 0, bif: 0, firsts: 0 });
        const regionless = season.dogs.filter((d) => d.region == null).length;

        return `
          <section class="card">
            <h2 class="card-title">Top 20 by region</h2>
            <p class="text-xs text-asfa-text/60 mb-3">
              Season through ${formatDate(season.as_of)}.
            </p>
            <div class="tbl-wrap"><table class="tbl">
              <thead><tr>
                <th scope="col" class="num">Region</th><th scope="col">States</th><th scope="col" class="num">Hounds in Top 20</th>
                <th scope="col" class="num">BOB</th><th scope="col" class="num">BIF</th><th scope="col" class="num">Ranked #1</th>
              </tr></thead>
              <tbody>
                ${rows.map((r) => `
                  <tr>
                    <td class="num font-semibold">${r.region}</td>
                    <td class="text-asfa-text/75 text-xs">${esc((r.states || []).join(', '))}</td>
                    <td class="num">${r.hounds}</td>
                    <td class="num">${r.bob}</td>
                    <td class="num ${r.bif ? 'font-semibold text-asfa-accent' : ''}">${r.bif}</td>
                    <td class="num">${r.firsts}</td>
                  </tr>`).join('')}
                <tr class="bg-asfa-bg2 font-semibold">
                  <td class="num">All</td><td></td><td class="num">${totals.hounds}</td>
                  <td class="num">${totals.bob}</td><td class="num">${totals.bif}</td>
                  <td class="num">${totals.firsts}</td>
                </tr>
              </tbody>
            </table></div>
            <p class="text-xs text-asfa-text/55 mt-3">
              <strong>Ranked #1</strong> counts hounds in the region currently sitting first in
              their breed, LCI division or the Singles stake.${
                regionless ? ` ${regionless} ranked hound${regionless === 1 ? '' : 's'}
                carr${regionless === 1 ? 'ies' : 'y'} no region, so the totals stop short of the
                full ${season.stats.hounds_ranked}.` : ''}
            </p>
          </section>`;
      };

      main.innerHTML = header + standings()
        + '<section id="trials"><div class="card"><p class="text-sm text-asfa-text/60">Loading trial results…</p></div></section>';

      loadTrials().then((trials) => {
        const byRegion = new Map(trials.regions.map((r) => [r.region, r]));
        const bp = trials.stats.by_program;
        const share = (n) => `${(100 * n / trials.stats.entries).toFixed(1)}%`;
        const rows = trials.by_region;
        const unassigned = rows.find((r) => r.region == null);
        const assigned = rows.filter((r) => r.region != null);

        const statesFor = (region) => {
          const def = byRegion.get(region);
          return def ? def.states.join(', ') : '';
        };

        document.getElementById('trials').innerHTML = `
          <div class="card">
            <h2 class="card-title">Trial entries by region</h2>
            <p class="text-xs text-asfa-text/60 mb-3">
              ${trials.stats.trials} trials, ${trials.stats.entries.toLocaleString()} entries,
              posted through ${formatDate(trials.as_of)}.
            </p>
            <div class="tbl-wrap"><table class="tbl">
              <thead><tr>
                <th scope="col" class="num">Region</th><th scope="col">States</th><th scope="col" class="num">Clubs</th>
                <th scope="col" class="num">Trials</th><th scope="col" class="num">Entries</th><th scope="col" class="num">Avg entry</th>
              </tr></thead>
              <tbody>
                ${[...assigned].sort((a, b) => b.entries - a.entries).map((r) => `
                  <tr>
                    <td class="num font-semibold">${r.region}</td>
                    <td class="text-asfa-text/75 text-xs">${esc(statesFor(r.region))}</td>
                    <td class="num">${r.clubs}</td>
                    <td class="num">${r.trials}</td>
                    <td class="num font-semibold text-asfa-accent">${r.entries.toLocaleString()}</td>
                    <td class="num">${r.average_entry}</td>
                  </tr>`).join('')}
                ${unassigned ? `
                  <tr class="bg-asfa-bg2">
                    <td class="num">—</td>
                    <td class="text-asfa-text/75 text-xs">club not matched to the ASFA club listing</td>
                    <td class="num">${unassigned.clubs}</td>
                    <td class="num">${unassigned.trials}</td>
                    <td class="num">${unassigned.entries}</td>
                    <td class="num">${unassigned.average_entry}</td>
                  </tr>` : ''}
              </tbody>
            </table></div>
            ${trials.unmatched_clubs.length ? `
              <p class="text-xs text-asfa-accent mt-3">
                Not matched to a region: ${trials.unmatched_clubs.map(esc).join('; ')}.
              </p>` : ''}
            <p class="text-xs text-asfa-text/55 mt-3">
              Regions 2 and 10 split California and Nevada by county rather than by state, which is
              why region comes from ASFA's club listing and is never guessed from a venue's address.
              Region definitions: ${esc(trials.region_source)}.
            </p>
          </div>

          <div class="card mt-6">
            <h2 class="card-title">Entries by program</h2>
            <p class="text-xs text-asfa-text/60 mb-3">
              What those ${trials.stats.entries.toLocaleString()} entries ran: a regular breed
              stake, the Singles stake, or the Lure Chasing Instinct program.
            </p>
            <div class="tbl-wrap"><table class="tbl">
              <thead><tr>
                <th scope="col">Program</th>
                <th scope="col" class="num">Entries</th>
                <th scope="col" class="num">Share</th>
              </tr></thead>
              <tbody>
                ${[['Breed stakes', bp.breed], ['LCI program', bp.lci],
                   ['Singles stake', bp.singles]].map(([label, n]) => `
                  <tr>
                    <td class="font-semibold">${label}</td>
                    <td class="num font-semibold text-asfa-accent">${n.toLocaleString()}</td>
                    <td class="num">${share(n)}</td>
                  </tr>`).join('')}
                ${bp.absent ? `
                  <tr>
                    <td class="text-asfa-text/70">Entered, never ran</td>
                    <td class="num">${bp.absent}</td>
                    <td class="num">${share(bp.absent)}</td>
                  </tr>` : ''}
              </tbody>
            </table></div>
            <p class="text-xs text-asfa-text/55 mt-3">
              ASFA's per-trial entry figure counts every program together, so this split is
              re-derived from the flight sizes in each trial's posted results. A flight printed
              "(0)" is a hound entered that never ran; its program can't be known from the
              published page, so it is shown separately rather than guessed into one.
            </p>
          </div>

          <div class="card mt-6">
            <h2 class="card-title">Trial entries by club</h2>
            <p class="text-xs text-asfa-text/60 mb-3">
              Every club that has held an ASFA trial in ${trials.season} so far.
            </p>
            <div class="tbl-wrap"><table class="tbl">
              <thead><tr>
                <th scope="col" class="num">#</th><th scope="col">Club</th><th scope="col" class="num">Region</th>
                <th scope="col" class="num">Trials</th><th scope="col" class="num">Entries</th><th scope="col">Where</th>
              </tr></thead>
              <tbody>
                ${trials.by_club.map((c, i) => `
                  <tr>
                    <td class="num text-asfa-text/50">${i + 1}</td>
                    <td class="font-semibold">${esc(c.club)}${
                      c.initials ? ` <span class="text-xs text-asfa-text/55">${esc(c.initials)}</span>` : ''}</td>
                    <td class="num">${c.region ?? '—'}</td>
                    <td class="num">${c.trials}</td>
                    <td class="num font-semibold text-asfa-accent">${c.entries}</td>
                    <td class="text-xs text-asfa-text/70">${esc(c.venue)}${
                      c.venue_count > 1 ? ` <span class="text-asfa-text/50">+${c.venue_count - 1}</span>` : ''}</td>
                  </tr>`).join('')}
              </tbody>
            </table></div>
            <p class="text-xs text-asfa-text/55 mt-3">
              Entry counts are as published in ASFA's monthly trial results. A trial's entry is the
              number of hounds entered, not the number that ran or earned points.
            </p>
          </div>`;
      }).catch((error) => {
        document.getElementById('trials').innerHTML = `
          <div class="card">
            <h2 class="card-title">Trial results unavailable</h2>
            <p class="text-sm">Could not load <code>data/trials.json</code>: ${esc(error.message)}</p>
            <p class="text-sm mt-2 text-asfa-text/70">The standings above are unaffected.</p>
          </div>`;
        console.error(error);
      });
    });
  </script>
</body>
</html>
