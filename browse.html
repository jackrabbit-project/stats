<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2C6E49">
  <title>Browse by breed — ASFA Coursing Stats</title>
  <meta name="description" content="Every hound ranked in the 2026 ASFA Top 20, breed by breed, with Bowen points, Best of Breed wins, Best in Field and breed standing.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abel&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
</head>
<body class="min-h-screen flex flex-col">
  <header id="site-header"></header>

  <main id="main" class="flex-1 max-w-6xl mx-auto w-full px-4 py-6 space-y-6">
    <div>
      <h1 class="font-abel text-3xl text-asfa-green">Browse standings</h1>
      <p class="text-sm text-asfa-text/70 mt-1">Pick a breed, an LCI division, or the Singles stake to see who ASFA has ranked in it this season.</p>
    </div>

    <div id="breed-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2"></div>
    <section id="table-panel"></section>
  </main>

  <footer id="site-footer" class="bg-asfa-navy text-white py-8"></footer>

  <script src="js/app.js"></script>
  <script>
    page('browse.html', (season) => {
      const grid = document.getElementById('breed-grid');
      const panel = document.getElementById('table-panel');
      let sort = { key: 'rank', dir: 1 };

      const sections = [...season.sections].sort((a, b) => a.breed.localeCompare(b.breed));

      function paintGrid(activeSlug) {
        grid.innerHTML = sections.map((section) => {
          const active = section.slug === activeSlug;
          const disabled = section.ranked === 0;
          return `<button data-slug="${section.slug}" ${disabled ? 'disabled' : ''}
            class="text-left px-3 py-2 border text-sm ${
              active ? 'bg-asfa-green text-white border-asfa-green'
                     : disabled ? 'bg-asfa-bg1 text-asfa-text/35 border-asfa-border cursor-not-allowed'
                                : 'bg-white border-asfa-border hover:border-asfa-accent'}">
            <span class="block font-semibold leading-tight">${esc(section.breed)}</span>
            <span class="block text-xs ${active ? 'text-white/75' : 'text-asfa-text/55'}">
              ${section.ranked ? `${section.ranked} ranked` : 'none ranked'}${
                section.total_competing ? ` · ${section.total_competing} competing` : ''}
            </span>
          </button>`;
        }).join('');

        grid.querySelectorAll('button[data-slug]').forEach((button) => {
          button.addEventListener('click', () => select(button.dataset.slug));
        });
      }

      function paintTable(slug) {
        const section = sections.find((s) => s.slug === slug);
        if (!section) { panel.innerHTML = ''; return; }

        const dogs = season.dogs.filter((dog) => dog.breed_slug === slug);
        const dir = sort.dir;
        const key = sort.key;
        const sorted = [...dogs].sort((a, b) => {
          const av = a[key] ?? -1;
          const bv = b[key] ?? -1;
          if (typeof av === 'string') return dir * av.localeCompare(bv);
          return dir * (av - bv) || a.rank - b.rank;
        });

        const columns = [
          ['rank', 'Rank', 'num'],
          ['call_name', 'Call name', ''],
          ['registered_name', 'Registered name', ''],
          ['owner_raw', 'Owner', ''],
          ['region', 'Region', 'num'],
          ['points', 'Points', 'num'],
          ['bob', 'BOB', 'num'],
          ['bif', 'BIF', 'num'],
          ['percentile', 'Standing', 'num'],
        ];

        const showMovement = season.previous_as_of && dogs.some((d) => d.movement);

        panel.innerHTML = `
          <div class="card">
            <div class="flex flex-wrap items-baseline justify-between gap-2">
              <h2 class="card-title mb-0">${esc(section.breed)}</h2>
              <p class="text-sm text-asfa-text/70">
                ${section.ranked} ranked${section.total_competing ? ` of ${section.total_competing} competing` : ''}
              </p>
            </div>
            <div class="tbl-wrap mt-4"><table class="tbl">
              <thead><tr>
                ${columns.map(([k, label, cls]) =>
                  `<th class="sortable ${cls}" data-key="${k}">${label}${
                    key === k ? ` <i class="fa-solid fa-caret-${dir === 1 ? 'up' : 'down'}"></i>` : ''}</th>`).join('')}
                ${showMovement ? '<th class="num">Since</th>' : ''}
              </tr></thead>
              <tbody>
                ${sorted.map((dog) => `
                  <tr>
                    <td class="num font-semibold">${dog.rank}</td>
                    <td><a href="${dogUrl(dog.id)}" class="lnk font-semibold">${esc(dog.call_name)}</a>${
                      dog.provisional ? ' <span class="badge badge-prov">provisional</span>' : ''}</td>
                    <td class="text-asfa-text/80">${esc(dog.registered_name)}</td>
                    <td class="text-asfa-text/80">${esc(dog.owner_raw)}</td>
                    <td class="num">${dog.region ?? '—'}</td>
                    <td class="num font-semibold">${dog.points}</td>
                    <td class="num">${dog.bob}</td>
                    <td class="num ${dog.bif ? 'font-semibold text-asfa-accent' : ''}">${dog.bif}</td>
                    <td class="num">${percentileLabel(dog)}</td>
                    ${showMovement ? `<td class="num">${movementBadge(dog.movement)}</td>` : ''}
                  </tr>`).join('')}
              </tbody>
            </table></div>
            <p class="text-xs text-asfa-text/55 mt-3">
              Standing is this hound's rank measured against the
              ${section.total_competing == null
                ? `${esc(section.breed)} entries`
                : competitorsLabel(section, section.total_competing)}
              ASFA reports competing this season.
            </p>
            ${section.is_breed ? '' : `
              <p class="text-xs text-asfa-text/65 mt-2">
                ${section.breed === 'Singles'
                  ? `Hounds run alone in the Singles stake, and its winner is not eligible for
                     Best of Breed or Best in Field (Running Rules Ch. V §5(d), §11).`
                  : `Best of Breed is contested between the breed stakes, which this division is not.`}
                Any BOB or BIF shown above was earned in that hound's breed competition, so those
                figures are reproduced as ASFA publishes them but are not counted toward
                ${esc(section.breed)} on any leaderboard or total.
              </p>`}
          </div>`;

        panel.querySelectorAll('th[data-key]').forEach((th) => {
          th.addEventListener('click', () => {
            const next = th.dataset.key;
            // Rank and name read best ascending; every stat reads best descending.
            const ascending = next === 'rank' || next === 'call_name'
              || next === 'registered_name' || next === 'owner_raw' || next === 'percentile';
            sort = sort.key === next
              ? { key: next, dir: -sort.dir }
              : { key: next, dir: ascending ? 1 : -1 };
            paintTable(slug);
          });
        });
      }

      function select(slug) {
        const url = new URL(window.location);
        url.searchParams.set('breed', slug);
        history.replaceState(null, '', url);
        paintGrid(slug);
        paintTable(slug);
      }

      const requested = param('breed');
      const initial = sections.find((s) => s.slug === requested && s.ranked)
        || sections.find((s) => s.ranked);
      paintGrid(initial ? initial.slug : null);
      if (initial) paintTable(initial.slug);
    });
  </script>
</body>
</html>
