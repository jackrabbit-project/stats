<body class="min-h-screen flex flex-col">
  <header id="site-header"></header>
  <main id="main" class="flex-1 max-w-5xl mx-auto w-full px-4 py-6 space-y-6"></main>
  <footer id="site-footer" class="bg-asfa-navy text-white py-8"></footer>

  <script src="js/app.js?v=20260924o"></script>
  <script src="js/card.js?v=20260924k"></script>
  <script src="js/racing.js?v=20260924o"></script>
  <script>
    (() => {
      const org = param('org');
      if (org !== 'lgra' && org !== 'aok9') {
        renderChrome(null, 'racing-dog.html', 'hub');
        document.getElementById('main').innerHTML = `<div class="card">
          <h1 class="card-title">Unknown racing program</h1>
          <p class="text-sm">This page shows one hound's LGRA or AOK9 record; the link is missing which.</p>
          <p class="text-sm mt-2"><a href="lgra.html" class="lnk">LGRA standings →</a> ·
            <a href="aok9.html" class="lnk">AOK9 standings →</a></p>
        </div>`;
        return;
      }
      // An AOK9 dog may also race Singles, or race nothing else.
      const singles = org === 'aok9'
        ? loadRacing('aok9-singles').catch((error) => { console.warn(error); return null; })
        : Promise.resolve(null);
      pageRacing('racing-dog.html', org, (feed) => singles.then((records) =>
        renderRacingDog(org, feed, document.getElementById('main'), records)));
    })();
  </script>
</body>
</html>
