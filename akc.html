<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F5EF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B1917">
  <title>AKC lure coursing by the numbers, 2026 — Gazehound Stats</title>
  <meta name="description" content="Every AKC lure coursing event in 2026 with its entry counts: by month, and ranked by trial, club and state, compiled from AKC's Event Search. Unofficial; AKC's event pages govern.">
  <link rel="canonical" href="https://stats.gazehound.io/akc.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Gazehound Stats">
  <meta property="og:title" content="AKC lure coursing by the numbers, 2026 — Gazehound Stats">
  <meta property="og:description" content="Every AKC lure coursing event in 2026 with its entry counts: by month, and ranked by trial, club and state. Unofficial; AKC's event pages govern.">
  <meta property="og:url" content="https://stats.gazehound.io/akc.html">
  <meta property="og:image" content="https://stats.gazehound.io/assets/og.png?v=4">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="assets/fonts/fraunces-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <script src="js/theme.js?v=20260823"></script>
  <link rel="stylesheet" href="css/app.css?v=20261029a">
  <link rel="icon" href="assets/favicon.ico?v=4" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=4">
</head>
<body class="min-h-screen flex flex-col">
  <header id="site-header"></header>
  <main id="main" class="flex-1 max-w-6xl mx-auto w-full px-4 py-6 space-y-6"></main>
  <footer id="site-footer" class="bg-asfa-navy text-white py-8"></footer>

  <script src="js/app.js?v=20261029a"></script>
  <script>
    /* One page of event-level counts, apart from the programs: every AKC
       lure coursing event this year with the entries it drew, from a
       collection made from AKC's Event Search. Rendered from
       data/akc.json; the AKC event pages are plain links. */
    pageFeed('akc.html', 'akc', 'data/akc.json', render);

    function render(feed) {
      const main = document.getElementById('main');
      const { stats, period, events } = feed;
      const n = (v) => (v == null ? '—' : Number(v).toLocaleString('en-US'));
      const avg = (v) => (v == null ? '—' : (Math.round(v * 10) / 10).toLocaleString('en-US'));
      const shortDate = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      const external = (href, text, cls = 'lnk') =>
        `<a href="${esc(href)}" class="${cls}" target="_blank" rel="noopener noreferrer">${text}</a>`;
      const tile = ([value, label, detail, title]) =>
        `<div class="tile"${title ? ` title="${esc(title)}"` : ''}><div class="tile-value text-asfa-akc">${value}</div><div class="tile-label">${label}</div>${
          detail ? `<div class="tile-label mt-0.5 text-asfa-text/60">${detail}</div>` : ''}</div>`;
      const rankCell = (rank) => `<td class="num text-asfa-text/50">${rank == null ? '—' : rank}</td>`;
      const postedBadge = (e) => (e.results_posted
        ? '<span class="badge badge-new">Posted</span>'
        : '<span class="badge badge-flat">Not yet</span>');

      const { trials, clubs, states } = feed.rankings;
      // AKC's Singles stakes, posted apart from Event Search: null before they were collected.
      const singles = feed.singles_source;
      // Starters by breed: null for a collection made before AKC's stakes were kept.
      const breedTable = feed.rankings.breeds && feed.rankings.breeds.length ? feed.rankings.breeds : null;
      const unrankedStates = states.filter((s) => s.rank == null);
      const unrankedClubs = clubs.filter((c) => c.rank == null);
      const breeds = [...new Set(events.filter((e) => e.specialty).map((e) => e.scope))].sort();
      const stateList = [...new Set(events.map((e) => e.state))].sort();
      const clubList = [...new Set(events.map((e) => e.club))].sort((a, b) => a.localeCompare(b));

      // Every section has its own address (akc#clubs) to share: the jump bar
      // lists them, and each heading's button copies its section's link.
      const SECTIONS_ON_PAGE = [
        ['months', 'By month'], ['states', 'States'], ...(breedTable ? [['breeds', 'Breeds']] : []),
        ['clubs', 'Clubs'], ['largest', 'Largest trials'], ['events', 'All events'], ['about', 'About'],
      ];
      // The button sits beside the heading rather than inside it, so a
      // screen reader's list of headings reads "Clubs", not "Clubs Copy link".
      const heading = (id, text) => `<div class="card-title flex items-baseline justify-between gap-3">
          <h2>${text}</h2>
          <button type="button" data-section="${id}"
            class="no-print inline-flex items-center gap-1 font-mono text-[11px] font-normal uppercase tracking-[0.1em] text-asfa-text/50 hover:text-asfa-text"
            aria-label="Copy the link to the ${text} section">${icon('link')}<span aria-hidden="true">Copy link</span></button>
        </div>`;
      // The address a shared link arrived with; the filters below rewrite the
      // query on their first paint, so it is read before they run.
      const arrivedAt = decodeURIComponent(location.hash.slice(1));

      main.innerHTML = `
        <div class="flex flex-wrap items-start justify-between gap-x-6 gap-y-3">
          <div class="max-w-3xl">
            <h1 class="font-display text-3xl text-asfa-text">AKC lure coursing by the numbers, ${feed.season}</h1>
            <p class="text-sm text-asfa-text/70 mt-1">
              Every AKC lure coursing event from ${formatDate(period.start)} through
              <span class="font-semibold text-asfa-akc">${formatDate(period.end)}</span>:
              ${n(stats.events)} events, ${n(stats.with_results)} with results posted, from AKC's
              ${external(feed.source.url, 'Event Search')}${singles ? `, with the Singles stakes from AKC's
              ${external(singles.url, 'Single Stakes Results')}, posted through ${formatDate(singles.through)}` : ''}.
              AKC does not publish lure coursing rankings by hound, so there are none here: this page counts
              events and entries.
            </p>
          </div>
          <a href="trials.html" class="btn shrink-0 whitespace-nowrap text-asfa-accent" title="The ASFA counterpart">ASFA trials by the numbers →</a>
        </div>

        <nav aria-label="On this page" class="no-print flex flex-wrap items-center gap-1">
          <span class="font-mono text-xs uppercase tracking-[0.1em] text-asfa-text/50 py-1.5">Jump to</span>
          ${SECTIONS_ON_PAGE.map(([id, label]) => `<a href="#${id}"
            class="pill-hover px-2.5 py-1.5 font-mono text-xs uppercase tracking-[0.1em] text-asfa-muted hover:text-asfa-text">${label}</a>`).join('')}
        </nav>

        <section class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3" aria-label="Totals">
          ${[
            [n(stats.events), 'events held'],
            [n(stats.total_entries), 'entries in all',
              `${n(stats.trial_entries)} trial + ${n(stats.singles)} Singles + ${n(stats.test_entries)} test`],
            [avg(stats.avg_entries), 'entries per trial, average',
              singles ? `${avg(stats.avg_trial_entries)} without Singles` : ''],
            [n(stats.largest_trial), 'largest trial', '', trials[0] ? `${trials[0].club}, ${formatDate(trials[0].date)}` : ''],
            [n(stats.clubs), 'clubs holding events'],
          ].map(tile).join('')}
        </section>

        <div class="grid grid-cols-1 gap-6">
          <section class="card" id="months">
            ${heading('months', 'By month')}
            <p class="text-xs text-asfa-text/55 mb-2">Entries count only events whose results AKC has posted. Avg trial counts LC trial entries and Singles starters.</p>
            <div class="tbl-wrap"><table class="tbl">
              <thead><tr>
                <th scope="col">Month</th><th scope="col" class="num">Events</th><th scope="col" class="num">Posted</th>
                <th scope="col" class="num">Trial entries</th><th scope="col" class="num">Singles</th><th scope="col" class="num">Test entries</th>
                <th scope="col" class="num">Total</th><th scope="col" class="num">Avg trial</th>
              </tr></thead>
              <tbody>
                ${feed.by_month.map((m) => `
                  <tr>
                    <td>${m.label}</td><td class="num">${m.events}</td><td class="num">${m.with_results}</td>
                    <td class="num font-semibold">${n(m.trial_entries)}</td><td class="num">${m.singles ? n(m.singles) : '—'}</td>
                    <td class="num">${n(m.test_entries)}</td>
                    <td class="num">${n(m.total_entries)}</td><td class="num">${avg(m.avg_entries)}</td>
                  </tr>`).join('')}
                <tr class="bg-asfa-bg2 font-semibold">
                  <td>Total</td><td class="num">${stats.events}</td><td class="num">${stats.with_results}</td>
                  <td class="num">${n(stats.trial_entries)}</td><td class="num">${n(stats.singles)}</td><td class="num">${n(stats.test_entries)}</td>
                  <td class="num">${n(stats.total_entries)}</td><td class="num">${avg(stats.avg_entries)}</td>
                </tr>
              </tbody>
            </table></div>
          </section>

          <section class="card" id="states">
            ${heading('states', 'States')}
            <p class="text-xs text-asfa-text/55 mb-2">Ranked by entries, Singles included. <span class="font-semibold">Events held</span> is every event in the state; <span class="font-semibold">With results</span> is only the trials AKC has posted results for, and those are what the entries and averages count.</p>
            <div id="states-table"></div>
          </section>
        </div>

        ${breedTable ? `
        <section class="card" id="breeds">
          ${heading('breeds', 'Starters by breed')}
          <p class="text-xs text-asfa-text/55 mb-2">Each breed's Open, Specials and Veterans stakes at the trials with results posted, ranked on starters. A hound counts once in every trial it runs, so a hound that ran six trials counts six times.</p>
          <div class="tbl-wrap"><table class="tbl">
            <thead><tr>
              <th scope="col" class="num">#</th><th scope="col">Breed</th>
              <th scope="col" class="num">Trials</th><th scope="col" class="num">Starters</th>
              <th scope="col" class="num">Avg</th><th scope="col" class="num">Largest</th>
            </tr></thead>
            <tbody>
              ${breedTable.map((b) => `
                <tr>
                  ${rankCell(b.rank)}<td class="font-semibold">${esc(b.breed)}</td>
                  <td class="num">${b.trials}</td>
                  <td class="num font-semibold text-asfa-akc" title="${b.open} Open, ${b.special} Specials, ${b.veteran} Veterans">${n(b.competitors)}</td>
                  <td class="num">${avg(b.avg_competitors)}</td><td class="num">${n(b.largest)}</td>
                </tr>`).join('')}
            </tbody>
          </table></div>
          <p class="text-xs text-asfa-text/55 mt-3">
            Counted from the stakes in each trial's posted results. Starters are the hounds that actually ran,
            so a trial's breeds add up to its starters, not its entries. <span class="font-semibold">Trials</span>
            is how many trials the breed had at least one starter in; <span class="font-semibold">Avg</span> is
            starters per such trial. Singles starters are counted everywhere else on this page (see the Singles
            column under All events) but can't be split by breed, because AKC's Singles sheets list only the
            placings.
          </p>
        </section>` : ''}

        <section class="card" id="clubs">
          ${heading('clubs', 'Clubs')}
          <p class="text-xs text-asfa-text/55 mb-2">Every club that held an AKC lure coursing event this year, ranked on trial entries and Singles starters at events with results posted.</p>
          <div class="tbl-wrap"><table class="tbl">
            <thead><tr>
              <th scope="col" class="num">#</th><th scope="col">Club</th><th scope="col">Where</th>
              <th scope="col" class="num">Trials</th><th scope="col" class="num">Trial entries</th><th scope="col" class="num">Singles</th>
              <th scope="col" class="num">Avg</th><th scope="col" class="num">Largest</th><th scope="col" class="num">Test entries</th>
            </tr></thead>
            <tbody>
              ${clubs.map((c) => `
                <tr>
                  ${rankCell(c.rank)}<td class="font-semibold">${esc(c.club)}</td>
                  <td class="text-xs text-asfa-text/70">${c.states.join(', ')}</td>
                  <td class="num">${c.trials || '—'}</td><td class="num font-semibold text-asfa-akc">${c.trials ? n(c.trial_entries) : '—'}</td>
                  <td class="num">${c.singles ? n(c.singles) : '—'}</td>
                  <td class="num">${avg(c.avg_entries)}</td><td class="num">${n(c.largest_trial)}</td>
                  <td class="num">${c.trials ? n(c.test_entries) : '—'}</td>
                </tr>`).join('')}
            </tbody>
          </table></div>
          ${unrankedClubs.length ? `<p class="text-xs text-asfa-text/55 mt-3">
            Clubs without a rank have events listed but no results posted yet.</p>` : ''}
        </section>

        <section class="card" id="largest">
          ${heading('largest', 'Largest trials')}
          <p class="text-xs text-asfa-text/55 mb-2">Trials with results posted, by entries: LC trial entries and Singles starters together; tied trials share a rank.</p>
          <div id="largest-table"></div>
        </section>

        <section class="card no-print" id="events">
          ${heading('events', 'All events')}
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <label class="block">
              <span class="text-xs font-semibold text-asfa-text/60 uppercase tracking-wide">State</span>
              <select id="f-state" class="mt-1 w-full select">
                <option value="">All states</option>
                ${stateList.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join('')}
              </select>
            </label>
            <label class="block">
              <span class="text-xs font-semibold text-asfa-text/60 uppercase tracking-wide">Club</span>
              <select id="f-club" class="mt-1 w-full select">
                <option value="">All clubs</option>
                ${clubList.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}
              </select>
            </label>
            <label class="block">
              <span class="text-xs font-semibold text-asfa-text/60 uppercase tracking-wide">Scope</span>
              <select id="f-scope" class="mt-1 w-full select">
                <option value="">All events</option>
                <option value="all-breed">All-breed only</option>
                <option value="specialty">Specialties only</option>
                ${breeds.map((b) => `<option value="${esc(b)}">${esc(b)}</option>`).join('')}
              </select>
            </label>
            <label class="block">
              <span class="text-xs font-semibold text-asfa-text/60 uppercase tracking-wide">Results</span>
              <select id="f-results" class="mt-1 w-full select">
                <option value="">Posted or not</option>
                <option value="posted">Results posted</option>
                <option value="pending">Not posted yet</option>
              </select>
            </label>
          </div>
          <p id="f-count" class="text-xs text-asfa-text/55 mt-3"></p>
        </section>

        <section class="card">
          <div id="events-table"></div>
          <p class="text-xs text-asfa-text/55 mt-3">
            Each event number opens AKC's page for that event. Blank counts: no test held, or results
            not yet posted by AKC. A blank Singles count: no Singles stake, or AKC has not posted it yet.
            Total counts trial entries, Singles and tests.
          </p>
        </section>

        <section class="card" id="about">
          ${heading('about', 'About this page')}
          <ul class="text-sm leading-relaxed list-disc pl-5 space-y-1">
            <li>AKC calls each trial an event: the lure coursing trial plus any tests run with it, under
              one event number.</li>
            <li>Trial entries are the Open, Specials and Veterans stakes. Test entries are the Junior Courser
              and Qualified Courser tests.</li>
            ${singles ? `<li>Singles are the starters in a trial's Singles stake, which AKC posts separately on its
              ${external(singles.url, 'Single Stakes Results')} page, a month or more after the trial (so far
              through ${formatDate(singles.through)}: ${n(stats.singles)} starters in ${n(stats.singles_stakes)} stakes).
              Every entries figure, average, largest trial and ranking on this page counts them with the trial
              entries; a trial whose Singles AKC has not posted counts its trial entries alone. AKC's Singles
              sheets give starters rather than entries.${feed.singles_unmatched.length
                ? ` ${feed.singles_unmatched.length} sheet${feed.singles_unmatched.length === 1 ? '' : 's'} could not be
                  matched to an event with results posted and ${feed.singles_unmatched.length === 1 ? 'is' : 'are'} left out.` : ''}</li>` : ''}
            <li>Competitors are the hounds that actually ran; entries include those that scratched.</li>
            <li>Starters by breed are read from the stakes in each trial's posted results: the hounds that
              started in each breed's Open, Specials and Veterans stakes, counted once in every trial they ran.</li>
            <li>A blank count means no test (or no trial) was held, or that AKC had not yet posted the
              event's results.</li>
            <li>Coursing Ability Tests and Fast CAT are not included.</li>
          </ul>
          <p class="text-sm leading-relaxed mt-4">
            Source: AKC's ${external(feed.source.url, 'Event Search')}, event type Lure Coursing Tests
            &amp; Trials, all states, one row per AKC event number, with the counts from each event's
            results page${singles ? `; and AKC's ${external(singles.url, 'Single Stakes Results')}, one sheet per
            Singles stake, of which only the club, event number, date and number of starters are kept` : ''}.
          </p>
          <p class="text-sm leading-relaxed mt-3">
            This page is an independent, unofficial compilation. It is not an AKC publication and is not
            affiliated with, endorsed by, or sponsored by the American Kennel Club. "AKC" and "American Kennel
            Club" are marks of The American Kennel Club, Inc., used here only to identify the source of the
            listings. AKC's event pages govern wherever they disagree with this one.
          </p>
          <p class="text-sm mt-3">
            Corrections: <a href="mailto:info@gazehound.io" class="lnk">info@gazehound.io</a>
          </p>
        </section>`;

      /* ----- states: the top dozen beside the by-month table, the rest on request */
      const STATES_SHOWN = 12;
      let statesExpanded = states.length <= STATES_SHOWN;
      const statesEl = document.getElementById('states-table');
      function paintStates() {
        const rows = statesExpanded ? states : states.slice(0, STATES_SHOWN);
        statesEl.innerHTML = `
          <div class="tbl-wrap"><table class="tbl">
            <thead><tr>
              <th scope="col" class="num">#</th><th scope="col">State</th><th scope="col" class="num">Events held</th>
              <th scope="col" class="num">With results</th><th scope="col" class="num">Trial entries</th><th scope="col" class="num">Singles</th>
              <th scope="col" class="num">Avg</th><th scope="col" class="num">Largest</th><th scope="col" class="num">Test entries</th>
            </tr></thead>
            <tbody>
              ${rows.map((s) => `
                <tr>
                  ${rankCell(s.rank)}<td class="font-semibold">${s.state}</td><td class="num">${s.events}</td>
                  <td class="num">${s.trials || '—'}</td><td class="num font-semibold text-asfa-akc">${s.trials ? n(s.trial_entries) : '—'}</td>
                  <td class="num">${s.singles ? n(s.singles) : '—'}</td>
                  <td class="num">${avg(s.avg_entries)}</td><td class="num">${n(s.largest_trial)}</td>
                  <td class="num">${s.with_results ? n(s.test_entries) : '—'}</td>
                </tr>`).join('')}
            </tbody>
          </table></div>
          ${states.length > STATES_SHOWN ? `<p class="text-sm mt-3 no-print">
            <button type="button" id="states-toggle" class="lnk">${statesExpanded ? `Show the top ${STATES_SHOWN}` : `Show all ${states.length} states`}</button></p>` : ''}
          ${statesExpanded && unrankedStates.length ? `<p class="text-xs text-asfa-text/55 mt-3">
            ${unrankedStates.map((s) => s.state).join(', ')}: events held, no results posted yet, so not ranked.</p>` : ''}`;
        const toggle = document.getElementById('states-toggle');
        if (toggle) toggle.addEventListener('click', () => { statesExpanded = !statesExpanded; paintStates(); });
      }
      paintStates();
      window.addEventListener('beforeprint', () => { if (!statesExpanded) { statesExpanded = true; paintStates(); } });

      /* ----- largest trials: top 20, the rest on request (and when printing) */
      let expanded = false;
      const largestEl = document.getElementById('largest-table');
      function paintLargest() {
        const rows = expanded ? trials : trials.slice(0, 20);
        largestEl.innerHTML = `
          <div class="tbl-wrap"><table class="tbl">
            <thead><tr>
              <th scope="col" class="num">#</th><th scope="col">Date</th><th scope="col">Club</th><th scope="col">Where</th>
              <th scope="col" class="num">Entries</th><th scope="col" class="num">Trial entries</th><th scope="col" class="num">Singles</th>
              <th scope="col" class="num">Competitors</th><th scope="col" class="num">Test entries</th>
            </tr></thead>
            <tbody>
              ${rows.map((t) => `
                <tr>
                  ${rankCell(t.rank)}<td class="whitespace-nowrap">${shortDate(t.date)}</td>
                  <td class="font-semibold">${esc(t.club)}${t.scope && t.scope.toLowerCase() !== 'all-breed'
                    ? ` <span class="text-xs text-asfa-text/55 font-normal">${esc(t.scope)}</span>` : ''}</td>
                  <td class="text-xs text-asfa-text/70 whitespace-nowrap">${esc(t.city)}, ${t.state}</td>
                  <td class="num font-semibold text-asfa-akc">${n(t.entries)}</td>
                  <td class="num">${n(t.trial_entries)}</td><td class="num">${n(t.singles)}</td>
                  <td class="num">${n(t.trial_competitors)}</td><td class="num">${n(t.test_entries)}</td>
                </tr>`).join('')}
            </tbody>
          </table></div>
          ${trials.length > 20 ? `<p class="text-sm mt-3 no-print">
            <button type="button" id="largest-toggle" class="lnk">${expanded ? 'Show the top 20' : `Show all ${trials.length} trials`}</button></p>` : ''}`;
        const toggle = document.getElementById('largest-toggle');
        if (toggle) toggle.addEventListener('click', () => { expanded = !expanded; paintLargest(); });
      }
      paintLargest();
      window.addEventListener('beforeprint', () => { if (!expanded) { expanded = true; paintLargest(); } });

      /* ----- every event: filters from the URL, a sortable table */
      const els = {
        state: document.getElementById('f-state'),
        club: document.getElementById('f-club'),
        scope: document.getElementById('f-scope'),
        results: document.getElementById('f-results'),
        count: document.getElementById('f-count'),
        table: document.getElementById('events-table'),
      };
      const initial = {
        state: param('state') || '', club: param('club') || '',
        scope: param('scope') || '', results: param('results') || '',
      };
      for (const key of ['state', 'club', 'scope', 'results']) {
        if (initial[key] && [...els[key].options].some((o) => o.value === initial[key])) els[key].value = initial[key];
      }

      const columns = [
        ['date', 'Date', '', 1],
        ['club', 'Club', '', 1],
        ['where', 'Where', '', 1],
        ['event_number', 'Event #', '', 1],
        ['trial_entries', 'Trial entries', 'num', -1],
        ['singles', 'Singles', 'num', -1],
        ['trial_competitors', 'Trial competitors', 'num', -1],
        ['test_entries', 'Test entries', 'num', -1],
        ['test_competitors', 'Test competitors', 'num', -1],
        ['total_entries', 'Total', 'num', -1],
        ['results_posted', 'Results', '', -1],
      ];
      const sort = { key: 'date', dir: 1 };
      const valueOf = (e, key) => {
        if (key === 'where') return `${e.city}, ${e.state}`;
        if (key === 'results_posted') return e.results_posted ? 1 : 0;
        return e[key];
      };
      function sorted(rows) {
        return [...rows].sort((a, b) => {
          const av = valueOf(a, sort.key);
          const bv = valueOf(b, sort.key);
          let order;
          if (av == null && bv == null) order = 0;
          else if (av == null) return 1;
          else if (bv == null) return -1;
          else if (typeof av === 'string') order = sort.dir * av.localeCompare(bv);
          else order = sort.dir * (av - bv);
          return order || a.date.localeCompare(b.date) || a.event_number.localeCompare(b.event_number);
        });
      }

      function syncUrl() {
        const q = new URLSearchParams();
        for (const key of ['state', 'club', 'scope', 'results']) if (els[key].value) q.set(key, els[key].value);
        const qs = q.toString();
        // The section a shared link points at stays in the address.
        history.replaceState(null, '', `${qs ? `?${qs}` : location.pathname}${location.hash}`);
      }

      function selected() {
        const f = { state: els.state.value, club: els.club.value, scope: els.scope.value, results: els.results.value };
        return events.filter((e) =>
          (!f.state || e.state === f.state)
          && (!f.club || e.club === f.club)
          && (!f.scope || (f.scope === 'all-breed' ? !e.specialty && e.scope
            : f.scope === 'specialty' ? e.specialty : e.scope === f.scope))
          && (!f.results || (f.results === 'posted') === e.results_posted));
      }

      function paintEvents() {
        syncUrl();
        const rows = sorted(selected());
        const filtering = ['state', 'club', 'scope', 'results'].some((key) => els[key].value);
        const shown = rows.filter((e) => e.results_posted);
        const entries = shown.reduce((sum, e) => sum + (e.entries || 0), 0);
        els.count.innerHTML = `Showing ${rows.length} of ${events.length} events${
          filtering ? `, ${shown.length} with results posted and ${n(entries)} entries between them, Singles included` : ''}.${
          filtering ? ' <button type="button" id="f-clear" class="lnk">Clear filters</button>' : ''}`;
        const clear = document.getElementById('f-clear');
        if (clear) clear.addEventListener('click', () => {
          for (const key of ['state', 'club', 'scope', 'results']) els[key].value = '';
          paintEvents();
        });
        els.table.innerHTML = rows.length ? `
          <div class="tbl-wrap"><table class="tbl">
            ${sortableHead(columns, sort)}
            <tbody>
              ${rows.map((e) => `
                <tr>
                  <td class="whitespace-nowrap">${shortDate(e.date)}<span class="block text-[10px] text-asfa-text/55 uppercase tracking-wide">${e.day}</span></td>
                  <td class="font-semibold">${esc(e.club)}${e.specialty
                    ? ` <span class="text-xs text-asfa-text/55 font-normal whitespace-nowrap">${esc(e.scope)}</span>` : ''}</td>
                  <td class="text-xs text-asfa-text/70 whitespace-nowrap">${esc(e.city)}, ${e.state}</td>
                  <td class="whitespace-nowrap">${external(e.url, e.event_number, 'lnk font-mono text-xs')}</td>
                  <td class="num font-semibold${e.results_posted ? ' text-asfa-akc' : ''}">${n(e.trial_entries)}</td>
                  <td class="num">${n(e.singles)}</td>
                  <td class="num">${n(e.trial_competitors)}</td>
                  <td class="num">${n(e.test_entries)}</td>
                  <td class="num">${n(e.test_competitors)}</td>
                  <td class="num font-semibold">${n(e.total_entries)}</td>
                  <td>${postedBadge(e)}</td>
                </tr>`).join('')}
            </tbody>
          </table></div>` : `<p class="text-sm text-asfa-text/70">No event matches those filters.</p>`;
        wireSort(els.table, columns, sort, paintEvents);
      }
      for (const key of ['state', 'club', 'scope', 'results']) els[key].addEventListener('change', paintEvents);
      paintEvents();

      /* ----- shareable sections: copy a section's link, and land on it */
      main.addEventListener('click', async (event) => {
        const button = event.target.closest('button[data-section]');
        if (!button) return;
        const id = button.dataset.section;
        const label = button.querySelector('span');
        history.replaceState(null, '', `${location.search || location.pathname}#${id}`);
        try {
          await navigator.clipboard.writeText(`${location.origin}${location.pathname}#${id}`);
          const spoken = button.getAttribute('aria-label');
          label.textContent = 'Copied';
          button.setAttribute('aria-label', 'Link copied');
          setTimeout(() => { label.textContent = 'Copy link'; button.setAttribute('aria-label', spoken); }, 2000);
        } catch {
          // Clipboard blocked: the section's address is in the address bar
          // to copy by hand, and no copy is claimed that did not happen.
        }
      });
      // The page draws after its data arrives, too late for the browser's own
      // jump to a link's section; make that jump now.
      const target = arrivedAt && document.getElementById(arrivedAt);
      if (target) target.scrollIntoView({ block: 'start', behavior: 'instant' });
    }
  </script>
</body>
</html>
