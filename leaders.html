<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F5EF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B1917">
  <title>Season leaders — Lure Coursing Stats</title>
  <meta name="description" content="Who leads the 2026 ASFA lure coursing season: most Best in Field, most Best of Breed, most Bowen points, and the highest standings within each breed.">
  <link rel="canonical" href="https://stats.gazehound.io/leaders.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Lure Coursing Stats">
  <meta property="og:title" content="Season leaders — Lure Coursing Stats">
  <meta property="og:description" content="Who leads the 2026 ASFA lure coursing season: most Best in Field, most Best of Breed, most Bowen points, and the highest standings within each breed.">
  <meta property="og:url" content="https://stats.gazehound.io/leaders.html">
  <meta property="og:image" content="https://stats.gazehound.io/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="assets/fonts/fraunces-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css?v=20260808">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
</head>
<body class="min-h-screen flex flex-col">
  <header id="site-header"></header>

  <main id="main" class="flex-1 max-w-6xl mx-auto w-full px-4 py-6 space-y-5">
    <div>
      <h1 class="font-display text-3xl text-asfa-text">Season leaders</h1>
      <p class="text-sm text-asfa-text/70 mt-1" id="subtitle"></p>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <div id="tabs" class="flex flex-wrap gap-1"></div>
      <label class="ml-auto text-sm text-asfa-text/70">
        Breed
        <select id="breed-filter" class="select ml-1"></select>
      </label>
    </div>

    <p id="note" class="text-xs text-asfa-text/65"></p>
    <section id="panel"></section>
  </main>

  <footer id="site-footer" class="bg-asfa-navy text-white py-8"></footer>

  <script src="js/app.js?v=20260808"></script>
  <script>
    page('leaders.html', (season) => {
      const BOARDS = {
        bif: {
          label: 'Best in Field',
          stat: 'bif',
          heading: 'BIF',
          // Ch. V §11: a single run between the day's Best of Breed winners,
          // offered at the host club's option. Counted live, so the rarity
          // figures stay true as the season runs.
          note: (pool) => {
            const inBreed = pool.filter((dog) => dog.is_breed);
            const holders = inBreed.filter((dog) => dog.bif);
            const once = holders.filter((dog) => dog.bif === 1).length;
            return 'A trial’s top award is a single run among the day’s Best of Breed '
              + 'winners, offered at the host club’s discretion. Winning it means '
              + 'outscoring every other breed’s champion in a single course, making it '
              + 'the most breed-neutral metric here. However, a rare breed does reach '
              + 'that run more easily, as a lone entry can take Best of Breed on its own '
              + `score. It is also remarkably rare: only ${holders.length} of the `
              + `${inBreed.length} hounds ranked in a breed hold one, and ${once} of `
              + 'those hold exactly one.';
          },
        },
        bob: {
          label: 'Best of Breed',
          stat: 'bob',
          heading: 'BOB',
          // Ch. V §7 awards Best of Breed to a single entry on its own combined
          // score, so a count of wins says nothing about the size of the field
          // beaten. The Rank column already carries that context; this points
          // at it rather than leaving the reader to notice.
          note: 'Best of Breed is won over the rest of the breed at a trial, and it is '
            + 'contested between the breed stakes, so the Singles stake and the LCI divisions '
            + 'are not counted here. Read the Rank column alongside the count: a breed entering '
            + 'one hound that day awards it Best of Breed on its own qualifying score, having '
            + 'beaten nobody, so ten wins in a breed of five is not ten wins in a breed of two '
            + 'hundred.',
        },
        points: {
          label: 'Top 20 points',
          stat: 'points',
          heading: 'Points',
          note: 'Bowen-system points are NOT comparable between breeds — a breed with 200 hounds competing offers far more of them than one with five. Use this within a section, or use standing to compare across them.',
        },
        percentile: {
          label: 'Standing',
          stat: 'percentile',
          heading: 'Standing',
          ascending: true,
          note: 'Each hound’s rank measured against every hound ASFA reports competing in its own breed, LCI division or the Singles stake. The fair way to compare a Whippet against an Azawakh — though a section that draws 200 hounds produces better-looking percentages than one that draws five, so this board favours the largest ones. Narrow it with the breed filter to read it within a breed.',
        },
      };

      const hounds = groupHounds(season.dogs);
      const tabs = document.getElementById('tabs');
      const filter = document.getElementById('breed-filter');
      const panel = document.getElementById('panel');
      const note = document.getElementById('note');

      document.getElementById('subtitle').textContent =
        `${season.season} season through ${formatDate(season.as_of)}.`;

      const sections = [...season.sections]
        .filter((section) => section.ranked)
        .sort((a, b) => a.breed.localeCompare(b.breed));
      filter.innerHTML = '<option value="">All breeds &amp; divisions</option>'
        + sections.map((s) => `<option value="${s.slug}">${esc(s.breed)}</option>`).join('');

      let current = (location.hash || '#bif').slice(1);
      if (!BOARDS[current]) current = 'bif';

      function paint() {
        const board = BOARDS[current];
        tabs.innerHTML = Object.entries(BOARDS).map(([key, item]) =>
          `<button data-board="${key}" class="tab ${key === current ? 'tab-active' : ''}"
            ${key === current ? 'aria-current="true"' : ''}>${item.label}</button>`
        ).join('');
        tabs.querySelectorAll('button[data-board]').forEach((button) => {
          button.addEventListener('click', () => {
            current = button.dataset.board;
            history.replaceState(null, '', `#${current}`);
            paint();
          });
        });

        // A note may be a plain string, or a function of the hound pool where
        // it quotes live figures.
        note.textContent = typeof board.note === 'function'
          ? board.note(hounds)
          : board.note;

        const slug = filter.value;
        let list = hounds.filter((dog) => !slug || dog.breed_slug === slug);
        list = list.filter((dog) => dog[board.stat] != null && dog[board.stat] > 0);
        list.sort((a, b) => (board.ascending
          ? a[board.stat] - b[board.stat]
          : b[board.stat] - a[board.stat]) || a.rank - b.rank);
        const matched = list.length;
        list = list.slice(0, 60);

        if (!list.length) {
          panel.innerHTML = `<div class="card"><p class="text-sm text-asfa-text/70">
            No hound has recorded ${esc(board.label.toLowerCase())} in this selection yet.</p></div>`;
          return;
        }

        const value = (dog) => board.stat === 'percentile'
          ? percentileLabel(dog)
          : dog[board.stat];

        panel.innerHTML = `
          <div class="card">
            <div class="tbl-wrap"><table class="tbl">
              <thead><tr>
                <th scope="col" class="num">#</th><th scope="col">Hound</th><th scope="col">Registered name</th>
                <th scope="col">Breed</th><th scope="col">Owner</th><th scope="col" class="num">${board.heading}</th>
                <th scope="col" class="num">Rank</th>
              </tr></thead>
              <tbody>${list.map((dog, index) => `
                <tr>
                  <td class="num text-asfa-text/70">${index + 1}</td>
                  <td><a href="${dogUrl(dog.id)}" class="lnk font-semibold">${esc(dog.call_name)}</a></td>
                  <td class="text-asfa-text/80">${esc(dog.registered_name)}</td>
                  <td><a href="${breedUrl(dog.breed_slug)}" class="lnk">${esc(dog.breed)}</a></td>
                  <td class="text-asfa-text/80">${esc(dog.owner_raw)}</td>
                  <td class="num font-semibold text-asfa-accent">${value(dog)}</td>
                  <td class="num">#${dog.rank}${dog.total_competing ? ` of ${dog.total_competing}` : ''}</td>
                </tr>`).join('')}</tbody>
            </table></div>
            ${matched > list.length ? `
              <p class="text-xs text-asfa-text/55 mt-3">
                Showing the top ${list.length} of ${matched}. Narrow it with the breed filter.
              </p>` : ''}
          </div>`;
      }

      filter.addEventListener('change', paint);
      window.addEventListener('hashchange', () => {
        const next = location.hash.slice(1);
        if (BOARDS[next] && next !== current) { current = next; paint(); }
      });
      paint();
    });
  </script>
</body>
</html>
