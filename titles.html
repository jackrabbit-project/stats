<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F5EF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1B1917">
  <title>New ASFA titles — Gazehound Stats</title>
  <meta name="description" content="Every hound with a new ASFA lure coursing title this season — Field Champion, Lure Courser of Merit, Coursing Proficiency and Lure Chasing Instinct titles, with dates and owners. Unofficial fan site.">
  <link rel="canonical" href="https://stats.gazehound.io/titles.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Gazehound Stats">
  <meta property="og:title" content="New ASFA titles — Gazehound Stats">
  <meta property="og:description" content="Every hound with a new ASFA lure coursing title this season — Field Champion, Lure Courser of Merit, Coursing Proficiency and Lure Chasing Instinct titles, with dates and owners. Unofficial fan site.">
  <meta property="og:url" content="https://stats.gazehound.io/titles.html">
  <meta property="og:image" content="https://stats.gazehound.io/assets/og.png?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="assets/fonts/fraunces-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <script src="js/theme.js?v=20260823"></script>
  <link rel="stylesheet" href="css/app.css?v=20260924a">
  <link rel="icon" href="assets/favicon.ico?v=3" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=3">
</head>
<body class="min-h-screen flex flex-col">
  <header id="site-header"></header>
  <main id="main" class="flex-1 max-w-5xl mx-auto w-full px-4 py-6 space-y-6"></main>
  <footer id="site-footer" class="bg-asfa-navy text-white py-8"></footer>

  <script src="js/app.js?v=20260924a"></script>
  <script>
    page('titles.html', (season) => {
      const main = document.getElementById('main');

      // The titles feed is separate from the standings, and a problem with it
      // must not take the chrome down with it.
      fetch('data/titles.json')
        .then((response) => {
          if (!response.ok) throw new Error(`${response.status} loading data/titles.json`);
          return response.json();
        })
        .then(render)
        .catch((error) => {
          console.error(error);
          showFailure(
            'Titles unavailable',
            `Could not load data/titles.json: ${error.message}`,
            'The rest of the site is unaffected. ASFA’s own title listing is at '
            + '<a href="https://www.asfa.org/titles/index.htm" class="lnk" target="_blank" rel="noopener noreferrer">asfa.org/titles</a>.'
          );
        });

      function render(feed) {
        const programs = feed.stats.by_program;
        const listed = feed.titles;
        let sort = { key: 'date', dir: -1 };

        // The tiles double as the program filter: key, tile label, count, and
        // the heading the table takes while that program is showing.
        const PROGRAMS = [
          ['all', 'titles awarded', feed.stats.total, 'Every new title'],
          ['breed', 'breed stakes', programs.breed || 0, 'Breed stake titles'],
          ['singles', 'Singles stake', programs.singles || 0, 'Singles stake titles'],
          ['lci', 'LCI program', programs.lci || 0, 'LCI program titles'],
        ];
        const programFromHash = () => {
          const key = location.hash.slice(1);
          return PROGRAMS.some(([k, , count]) => k === key && k !== 'all' && count) ? key : 'all';
        };
        let filter = programFromHash();

        // Colour families: Field Champion and Lure Courser of Merit in the
        // breed stakes, Coursing Proficiency in the Singles stake, and the Lure
        // Chasing Instinct ladder. Keyed on the program rather than the
        // abbreviation because LCC and LCE are LCI titles while LCM is a breed
        // one. Veteran and numbered tiers stay with their family.
        const family = (row) => {
          if (row.program === 'lci') return 'badge-t-lci';
          if (row.program === 'singles') return 'badge-t-tcp';
          return row.title_abbr.replace(/\d+$/, '').endsWith('FCh')
            ? 'badge-t-fch' : 'badge-t-lcm';
        };

        const hound = (row) => row.dog_id
          ? `<a href="${dogUrl(row.dog_id)}" class="lnk font-semibold">${esc(row.call_name)}</a>`
          : `<span class="font-semibold">${esc(row.call_name)}</span>`;

        const columns = [
          ['date', 'Date'],
          ['title', 'Title'],
          ['hound', 'Hound'],
          [null, 'Registered name'],
          ['breed', 'Breed'],
          [null, 'Owner'],
        ];
        const keyOf = {
          date: (row) => row.date,
          title: (row) => row.title_abbr,
          hound: (row) => row.call_name.toLowerCase(),
          breed: (row) => row.section,
        };

        main.innerHTML = `
          <div>
            <h1 class="font-display text-3xl text-asfa-text">New ASFA titles</h1>
            <p class="text-sm text-asfa-text/70 mt-1">
              Every hound that finished an ASFA title in ${feed.season}, as posted on
              <a href="${esc(feed.source_url)}" class="lnk" target="_blank" rel="noopener noreferrer">ASFA's title listing</a>
              through ${formatDate(feed.as_of)}.
            </p>
          </div>

          <section id="filters" class="grid grid-cols-2 md:grid-cols-4 gap-3"
                   role="group" aria-label="Show titles from one program">
            ${PROGRAMS.map(([key, label, count]) => `
              <button type="button" class="tile tile-btn" data-program="${key}"
                      aria-pressed="false"${count ? '' : ' disabled'}>
                <span class="tile-value">${count}</span>
                <span class="tile-label">${label}</span>
              </button>`).join('')}
          </section>

          <section class="card">
            <h2 class="card-title" id="table-title">Every new title</h2>
            <div id="title-table"></div>
            <p class="text-xs text-asfa-text/65 mt-3">
              <span class="badge badge-t-fch">FCh</span> Field Champion family ·
              <span class="badge badge-t-lcm">LCM</span> Lure Courser of Merit family ·
              <span class="badge badge-t-tcp">TCP</span> Coursing Proficiency (Singles stake) ·
              <span class="badge badge-t-lci">LCI</span> Lure Chasing Instinct program.
              A hound's name links to its profile where it also appears in the Top 20 standings;
              titles go to plenty of hounds outside the Top 20, so many rows stand alone.
            </p>
          </section>`;

        function paint() {
          const [, , , heading] = PROGRAMS.find(([key]) => key === filter);
          document.getElementById('table-title').textContent = heading;
          document.querySelectorAll('#filters button[data-program]').forEach((btn) => {
            btn.setAttribute('aria-pressed', String(btn.dataset.program === filter));
          });

          const shown = listed.filter((row) => filter === 'all' || row.program === filter);
          const sorted = [...shown].sort((a, b) => {
            const av = keyOf[sort.key](a);
            const bv = keyOf[sort.key](b);
            return sort.dir * av.localeCompare(bv)
              || b.date.localeCompare(a.date)
              || a.call_name.localeCompare(b.call_name);
          });

          document.getElementById('title-table').innerHTML = `
            <div class="tbl-wrap"><table class="tbl">
              <thead><tr>
                ${columns.map(([key, label]) => key ? `
                  <th scope="col" class="sortable" aria-sort="${
                    sort.key === key ? (sort.dir === 1 ? 'ascending' : 'descending') : 'none'}">
                    <button type="button" class="th-btn" data-key="${key}">${label}${
                      sort.key === key ? icon(sort.dir === 1 ? 'chevronUp' : 'chevronDown') : ''}</button></th>`
                  : `<th scope="col">${label}</th>`).join('')}
              </tr></thead>
              <tbody>
                ${sorted.map((row) => `
                  <tr>
                    <td class="num whitespace-nowrap">${formatDate(row.date)}</td>
                    <td><span class="badge ${family(row)}" title="${esc(row.title)}">${esc(row.title_abbr)}</span></td>
                    <td>${hound(row)}</td>
                    <td class="text-asfa-text/80">${esc(row.registered_name)}</td>
                    <td>${esc(row.section)}</td>
                    <td class="text-asfa-text/80">${esc(row.owners_raw)}</td>
                  </tr>`).join('')}
              </tbody>
            </table></div>`;

          document.querySelectorAll('#title-table button[data-key]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const next = btn.dataset.key;
              // Dates read best newest-first; the text columns best A-to-Z.
              sort = sort.key === next
                ? { key: next, dir: -sort.dir }
                : { key: next, dir: next === 'date' ? -1 : 1 };
              paint();
            });
          });
        }

        // Filtering is deep-linkable, so the LCI page and a Facebook post can
        // point straight at one program: titles.html#lci.
        document.getElementById('filters').addEventListener('click', (event) => {
          const btn = event.target.closest('button[data-program]');
          if (!btn || btn.disabled || btn.dataset.program === filter) return;
          filter = btn.dataset.program;
          history.replaceState(null, '', filter === 'all' ? location.pathname : `#${filter}`);
          paint();
        });
        window.addEventListener('hashchange', () => {
          const next = programFromHash();
          if (next !== filter) { filter = next; paint(); }
        });

        paint();
      }
    });
  </script>
</body>
</html>
