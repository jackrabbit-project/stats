name: Refresh standings and grading guides

# ASFA republishes the Top 20 roughly monthly, and the LGRA and AOK9 grading
# guides are reissued every week or two in season. Checking weekly catches an
# update within a few days; each fetcher exits without writing when its source
# is unchanged, so a quiet week costs a handful of requests.
on:
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest standings
        run: python tools/fetch.py

      - name: Refresh the club directory
        # Only changes when ASFA republishes the club listing; cheap to check.
        run: python tools/clubs.py

      - name: Refresh the LGRA grading guide
        # A racing body's outage must never block the ASFA refresh; the feed
        # on disk is rebuilt from archived snapshots and check.py still runs.
        continue-on-error: true
        run: python tools/lgra.py

      - name: Refresh the AOK9 sprint grading guide
        continue-on-error: true
        run: python tools/aok9.py

      - name: Refresh the AOK9 Singles sprint records
        # After the sprint guide: each Singles dog is joined to its sprint page.
        continue-on-error: true
        run: python tools/aok9_singles.py

      - name: Refresh the NOTRA Other-Breed grading guide
        continue-on-error: true
        run: python tools/notra.py

      - name: Refresh the WRA grading guide (Whippet racing, beta)
        continue-on-error: true
        run: python tools/wra.py

      - name: Refresh the NOTRA Whippet grading guide (Whippet racing, beta)
        continue-on-error: true
        run: python tools/notra_whippets.py

      # Whippet racing is in beta, so each whippet guide is verified on its
      # own: one that fails its checks goes back to the last committed copy,
      # every other program still updates, and the run is flagged at the end.
      - name: Verify the WRA data
        id: check_wra
        continue-on-error: true
        run: python tools/check.py --only wra

      - name: Hold back the WRA data if it failed its checks
        if: steps.check_wra.outcome == 'failure'
        run: |
          git checkout -- data/wra.json data/wra-registry.json data/wra/
          git clean -fdq -- data/wra/

      - name: Verify the NOTRA Whippet data
        id: check_notra_whippets
        continue-on-error: true
        run: python tools/check.py --only notra-whippets

      - name: Hold back the NOTRA Whippet data if it failed its checks
        if: steps.check_notra_whippets.outcome == 'failure'
        run: |
          git checkout -- data/notra-whippets.json data/notra-whippets-registry.json data/notra-whippets/
          git clean -fdq -- data/notra-whippets/

      - name: Refresh CWA's grading guides, standings and titles (Whippet racing, beta)
        continue-on-error: true
        run: python tools/cwa.py

      - name: Verify the CWA data
        id: check_cwa
        continue-on-error: true
        run: python tools/check.py --only cwa

      - name: Hold back the CWA data if it failed its checks
        if: steps.check_cwa.outcome == 'failure'
        run: |
          git checkout -- data/cwa.json data/cwa-registry.json data/cwa/
          git clean -fdq -- data/cwa/

      - name: Refresh the AKC lure coursing entries
        # Collected from AKC's Event Search and each event's results page,
        # with any new sheet on AKC's Single Stakes Results page; when AKC
        # cannot be reached the feed is rebuilt from the newest committed
        # collection and the Singles record on file.
        continue-on-error: true
        run: python tools/akc.py

      - name: Parse, build and verify
        run: |
          python tools/parse.py
          # When ASFA's trial results cannot be read, the last good trial
          # data stays; standings, titles, events and racing still update.
          if ! python tools/trials.py; then
            echo "::warning::ASFA's trial results could not be read; keeping the last committed trial data"
            git checkout -- data/trials.json data/trials/raw/
            git clean -fdq -- data/trials/raw/
          fi
          python tools/events.py
          python tools/build.py
          python tools/titles.py
          python tools/check.py --skip wra,notra-whippets,cwa

      - name: Commit if anything changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- data/; then
            echo "No change in the published standings or guides."
            exit 0
          fi
          CHANGED=$( (git diff --name-only -- data/; git ls-files --others --exclude-standard -- data/) )
          PARTS=()
          if echo "$CHANGED" | grep -q '^data/season.json$'; then
            PARTS+=("ASFA standings through $(python -c "import json;print(json.load(open('data/season.json'))['as_of'])")")
          fi
          if echo "$CHANGED" | grep -q '^data/lgra.json$'; then
            PARTS+=("LGRA guide $(python -c "import json;print(json.load(open('data/lgra.json'))['guide_date'])")")
          fi
          if echo "$CHANGED" | grep -q '^data/aok9.json$'; then
            PARTS+=("AOK9 guide $(python -c "import json;print(json.load(open('data/aok9.json'))['guide_date'])")")
          fi
          if echo "$CHANGED" | grep -q '^data/aok9-singles/snapshots/'; then
            PARTS+=("AOK9 Singles records $(python -c "import json;print(json.load(open('data/aok9-singles.json'))['guide_date'])")")
          fi
          if echo "$CHANGED" | grep -q '^data/notra.json$'; then
            PARTS+=("NOTRA guide $(python -c "import json;print(json.load(open('data/notra.json'))['guide_date'])")")
          fi
          if echo "$CHANGED" | grep -q '^data/wra/snapshots/'; then
            PARTS+=("WRA guide $(python -c "import json;print(json.load(open('data/wra.json'))['guide_date'])")")
          fi
          if echo "$CHANGED" | grep -q '^data/wra/meets-run.json$'; then
            PARTS+=("WRA meets run $(python -c "import json;print(json.load(open('data/wra/meets-run.json'))['latest_meet'])")")
          fi
          if echo "$CHANGED" | grep -q '^data/cwa/snapshots/'; then
            PARTS+=("CWA guide $(python -c "import json;print(json.load(open('data/cwa.json'))['guide_date'])")")
          fi
          if echo "$CHANGED" | grep -q '^data/notra-whippets/snapshots/'; then
            PARTS+=("NOTRA Whippet guide $(python -c "import json;print(json.load(open('data/notra-whippets.json'))['guide_date'])")")
          fi
          if echo "$CHANGED" | grep -q '^data/akc.json$'; then
            PARTS+=("AKC entries collected $(python -c "import json;print(json.load(open('data/akc.json'))['collected'])")")
          fi
          if [ ${#PARTS[@]} -eq 0 ]; then PARTS+=("Data refresh"); fi
          MSG=$(IFS=';'; echo "${PARTS[*]}" | sed 's/;/; /g')
          git add data/
          git commit -m "$MSG"
          git push

      - name: Flag whippet data held back
        if: steps.check_wra.outcome == 'failure' || steps.check_notra_whippets.outcome == 'failure' || steps.check_cwa.outcome == 'failure'
        run: |
          echo "::error title=Whippet data held back::A whippet body's data failed its checks and was not published this week. The other programs updated as usual. See the Verify steps for the failures."
          exit 1
