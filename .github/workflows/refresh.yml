name: Refresh standings and grading guides

# ASFA republishes the Top 20 roughly monthly, and the LGRA and AOK9 grading
# guides are reissued every week or two in season. Checking weekly catches an
# update within a few days; each fetcher exits without writing when its source
# is unchanged, so a quiet week costs a handful of requests.
on:
  schedule:
    - cron: '17 11 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest standings
        run: python tools/fetch.py

      - name: Refresh the club directory
        # Only changes when ASFA republishes the club listing; cheap to check.
        run: python tools/clubs.py

      - name: Refresh the LGRA grading guide
        # A racing body's outage must never block the ASFA refresh; the feed
        # on disk is rebuilt from archived snapshots and check.py still runs.
        continue-on-error: true
        run: python tools/lgra.py

      - name: Refresh the AOK9 sprint grading guide
        continue-on-error: true
        run: python tools/aok9.py

      - name: Refresh the AOK9 Singles sprint records
        # After the sprint guide: each Singles dog is joined to its sprint page.
        continue-on-error: true
        run: python tools/aok9_singles.py

      - name: Parse, build and verify
        run: |
          python tools/parse.py
          python tools/trials.py
          python tools/events.py
          python tools/build.py
          python tools/titles.py
          python tools/check.py

      - name: Commit if anything changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- data/; then
            echo "No change in the published standings or guides."
            exit 0
          fi
          CHANGED=$(git diff --name-only -- data/)
          PARTS=()
          if echo "$CHANGED" | grep -q '^data/season.json$'; then
            PARTS+=("ASFA standings through $(python -c "import json;print(json.load(open('data/season.json'))['as_of'])")")
          fi
          if echo "$CHANGED" | grep -q '^data/lgra.json$'; then
            PARTS+=("LGRA guide $(python -c "import json;print(json.load(open('data/lgra.json'))['guide_date'])")")
          fi
          if echo "$CHANGED" | grep -q '^data/aok9.json$'; then
            PARTS+=("AOK9 guide $(python -c "import json;print(json.load(open('data/aok9.json'))['guide_date'])")")
          fi
          if echo "$CHANGED" | grep -q '^data/aok9-singles/snapshots/'; then
            PARTS+=("AOK9 Singles records $(python -c "import json;print(json.load(open('data/aok9-singles.json'))['guide_date'])")")
          fi
          if [ ${#PARTS[@]} -eq 0 ]; then PARTS+=("Data refresh"); fi
          MSG=$(IFS=';'; echo "${PARTS[*]}" | sed 's/;/; /g')
          git add data/
          git commit -m "$MSG"
          git push
