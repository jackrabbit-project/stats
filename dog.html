<body class="min-h-screen flex flex-col">
  <header id="site-header"></header>
  <main id="main" class="flex-1 max-w-5xl mx-auto w-full px-4 py-6 space-y-6"></main>
  <footer id="site-footer" class="bg-asfa-navy text-white py-8"></footer>

  <script src="js/app.js?v=20261118a"></script>
  <script src="js/card.js?v=20261117a"></script>
  <script>
    /* The season so far: the hound's Top 20 points at each ASFA standings
       update this site has kept (ASFA prints running season totals, so the
       line can only climb or hold), one dot per update on a date scale, the
       latest value labelled. Rank sits in the summary, the hover readout and
       the table, never on a second axis. Drawn only when there is a change to
       show: one listing is not a trend, and an unchanged total gets a
       sentence instead of a flat line. */
    function paintSeason(card, dog, history) {
      const series = history && history.hounds[dog.id];
      if (!card || !series) return;
      // A hound ASFA re-spelled mid-season keeps one history; the name it
      // was printed under at the earlier updates shows in the table.
      const printed = (history.printed && history.printed[dog.id]) || [];
      const updates = history.snapshots.map((date, i) => ({
        date, points: series[i] ? series[i][0] : null, rank: series[i] ? series[i][1] : null,
        printed: printed[i] || null,
      }));
      const listed = updates.filter((u) => u.points != null);
      if (listed.length < 2) return;

      const first = listed[0];
      const last = listed[listed.length - 1];
      const changed = listed.some((u) => u.points !== first.points);
      const where = esc(rankContext(dog));
      const gained = last.points - first.points;
      const rankNote = last.rank === first.rank
        ? `ranked #${last.rank} ${where} ${changed ? 'at both' : 'at the first and the latest'}`
        : `ranked #${last.rank} ${where}${changed ? '' : ' now'}, ${last.rank < first.rank ? 'up' : 'down'} from #${first.rank}`;
      const summary = changed
        ? `${first.points} point${first.points === 1 ? '' : 's'} on ${formatDate(first.date)}, ${last.points} on
           ${formatDate(last.date)}: ${gained >= 0 ? 'up' : 'down'} ${Math.abs(gained)}; ${rankNote}.`
        : `${last.points} point${last.points === 1 ? '' : 's'} at each of the ${listed.length} standings updates since
           ${formatDate(first.date)}, so there is no line to draw; ${rankNote}.`;
      // Updates between the first listing and the latest where the hound
      // dropped out of the Top 20: said in words, and the line breaks there.
      const out = updates.slice(updates.indexOf(first), updates.indexOf(last)).filter((u) => u.points == null);
      const outNote = out.length
        ? ` Out of the Top 20 on ${out.map((u) => formatDate(u.date)).join(', ').replace(/, ([^,]+, \d{4})$/, ' and $1')}${changed ? ', where the line breaks' : ''}.`
        : '';
      const kept = formatDate(history.snapshots[0]);

      card.innerHTML = `
        <h2 id="season-title" class="card-title">Points this season</h2>
        <p class="text-sm">${summary}${outNote}</p>
        ${changed ? '<div class="season-chart relative mt-3" tabindex="0" role="img"></div>' : ''}
        <details class="mt-3">
          <summary class="text-sm lnk cursor-pointer w-fit">Each update</summary>
          <div class="tbl-wrap mt-2"><table class="tbl">
            <thead><tr><th scope="col">ASFA standings of</th><th scope="col" class="num">Points</th><th scope="col" class="num">Rank</th></tr></thead>
            <tbody>${updates.map((u) => `<tr><td>${formatDate(u.date)}${u.printed
              ? `<span class="block text-xs text-asfa-text/70">listed as ${esc(u.printed)}</span>` : ''}</td>${u.points == null
              ? '<td class="num" colspan="2">not in the Top 20</td>'
              : `<td class="num">${u.points}</td><td class="num">#${u.rank}</td>`}</tr>`).join('')}</tbody>
          </table></div>
        </details>
        <p class="text-xs text-asfa-text/70 mt-2">Each dot is a Top 20 standings update ASFA published; ASFA's
          figures are running season totals. This site has kept every update since ${kept}.${printed.some(Boolean)
            ? ' ASFA corrected this hound\'s name during the season; the table gives the name as printed at each update.' : ''}</p>`;
      card.classList.remove('hidden');
      if (!changed) return;

      const box = card.querySelector('.season-chart');
      box.setAttribute('aria-label', `Points this season: ${listed.map((u) => `${u.points} on ${formatDate(u.date)}`).join(', ')}.`);
      const tip = document.createElement('div');
      tip.className = 'chart-tip hidden';
      const day = (iso) => Date.parse(`${iso}T00:00:00Z`);
      const short = (iso) => new Date(day(iso)).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
      let focus = updates.indexOf(last);

      function draw() {
        const W = Math.max(260, box.clientWidth);
        const H = 190;
        const M = { top: 12, right: 40, bottom: 26, left: 34 };
        const t0 = day(updates[0].date);
        const t1 = day(updates[updates.length - 1].date);
        const x = (iso) => M.left + (W - M.left - M.right) * (t1 === t0 ? 0.5 : (day(iso) - t0) / (t1 - t0));
        // A clean top for the scale: 1, 2 or 5 times a power of ten.
        const max = Math.max(...listed.map((u) => u.points));
        const steps = [1, 2, 2.5, 5, 10].map((m) => m * 10 ** Math.floor(Math.log10(Math.max(1, max / 3))));
        const step = steps.find((s) => max / s <= 4) || steps[steps.length - 1];
        const top = Math.max(step, Math.ceil(max / step) * step);
        const y = (v) => M.top + (H - M.top - M.bottom) * (1 - v / top);
        const ticks = [];
        for (let v = 0; v <= top + 1e-9; v += step) ticks.push(v);

        // The line breaks where the hound was not listed.
        const runs = [];
        let run = [];
        updates.forEach((u) => {
          if (u.points == null) { if (run.length) runs.push(run); run = []; } else run.push(u);
        });
        if (run.length) runs.push(run);
        const path = (r) => r.map((u, i) => `${i ? 'L' : 'M'}${x(u.date).toFixed(1)},${y(u.points).toFixed(1)}`).join('');
        const area = (r) => `${path(r)}L${x(r[r.length - 1].date).toFixed(1)},${y(0)}L${x(r[0].date).toFixed(1)},${y(0)}Z`;

        // Dates on the axis: the first and the last always, the others where
        // they clear their neighbours by 8px (11px mono: about 6.6px a letter;
        // the first label runs right from its date, the last runs left).
        const textW = (s) => s.length * 6.6;
        const lastLeft = x(updates[updates.length - 1].date) - textW(short(updates[updates.length - 1].date));
        let usedTo = -Infinity;
        const labels = updates.map((u, i) => {
          const px = x(u.date);
          const text = short(u.date);
          const end = i === updates.length - 1;
          const left = i === 0 ? px : end ? px - textW(text) : px - textW(text) / 2;
          const right = left + textW(text);
          const show = i === 0 || end || (left > usedTo + 8 && right < lastLeft - 8);
          if (show) usedTo = right;
          return show ? `<text x="${px}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : end ? 'end' : 'middle'}">${text}</text>` : '';
        }).join('');

        box.innerHTML = `
          <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">
            <g class="chart-grid">${ticks.map((v) => `<line x1="${M.left}" x2="${W - M.right}" y1="${y(v)}" y2="${y(v)}"/>`).join('')}</g>
            <g class="chart-axis">${ticks.map((v) => `<text x="${M.left - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join('')}${labels}</g>
            ${runs.map((r) => `<path class="chart-area" d="${area(r)}"/>`).join('')}
            ${runs.map((r) => `<path class="chart-line" d="${path(r)}"/>`).join('')}
            <line class="chart-cross hidden" y1="${M.top}" y2="${H - M.bottom}"/>
            ${listed.map((u) => `<circle class="chart-dot" cx="${x(u.date)}" cy="${y(u.points)}" r="4"/>`).join('')}
            <text class="chart-end" x="${x(last.date) + 8}" y="${y(last.points) + 4}">${last.points}</text>
            <rect class="chart-hit" x="0" y="0" width="${W}" height="${H}"/>
          </svg>`;
        box.appendChild(tip);

        const cross = box.querySelector('.chart-cross');
        const show = (i) => {
          focus = i;
          const u = updates[i];
          const px = x(u.date);
          cross.setAttribute('x1', px);
          cross.setAttribute('x2', px);
          cross.classList.remove('hidden');
          tip.replaceChildren();
          const value = document.createElement('strong');
          value.textContent = u.points == null ? 'Not in the Top 20' : `${u.points} point${u.points === 1 ? '' : 's'}`;
          const sub = document.createElement('span');
          sub.textContent = `${u.rank ? `#${u.rank} ${rankContext(dog)} · ` : ''}${formatDate(u.date)}`;
          tip.append(value, sub);
          tip.classList.remove('hidden');
          const tipW = tip.offsetWidth;
          tip.style.left = `${Math.min(Math.max(0, px - tipW / 2), W - tipW)}px`;
        };
        const hide = () => { cross.classList.add('hidden'); tip.classList.add('hidden'); };
        const nearest = (clientX) => {
          const bx = box.getBoundingClientRect().left;
          let best = 0;
          updates.forEach((u, i) => { if (Math.abs(x(u.date) - (clientX - bx)) < Math.abs(x(updates[best].date) - (clientX - bx))) best = i; });
          return best;
        };
        const hit = box.querySelector('.chart-hit');
        hit.addEventListener('pointermove', (event) => show(nearest(event.clientX)));
        hit.addEventListener('pointerleave', hide);
        box.onfocus = () => show(focus);
        box.onblur = hide;
        box.onkeydown = (event) => {
          if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
            event.preventDefault();
            show(Math.min(updates.length - 1, Math.max(0, focus + (event.key === 'ArrowRight' ? 1 : -1))));
          }
        };
      }

      draw();
      let pending = null;
      window.addEventListener('resize', () => {
        clearTimeout(pending);
        pending = setTimeout(draw, 150);
      });
    }

    page('dog.html', (season) => {
      const main = document.getElementById('main');
      const id = param('id');
      const dog = season.dogs.find((d) => d.id === id);

      if (!dog) {
        main.innerHTML = `<div class="card">
          <h1 class="card-title">Hound not found</h1>
          <p class="text-sm">No hound in the ${season.season} standings matches
          <code>${esc(id || '(no id given)')}</code>.</p>
          <p class="text-sm mt-2"><a href="index.html" class="lnk">Search by name →</a></p>
        </div>`;
        return;
      }

      document.title = `${dog.call_name} — ${dog.breed} — Gazehound Stats`;

      // Other rows for the same hound: the Singles stake re-ranks hounds that
      // also appear under their breed.
      const alsoRanked = season.dogs.filter(
        (d) => d.hound_key === dog.hound_key && d.id !== dog.id
      );

      // Titles ride along in the registered name. Only ASFA's own are shown,
      // as badges in the families the titles page uses; other bodies' titles
      // stay in the registered name line and nowhere else.
      const ASFA_TITLES = new Set(['FCH', 'VFCH', 'LCM', 'VLCM', 'TCP', 'CPX',
        'LCI', 'LCC', 'VLCC', 'LCA', 'LCE']);
      const isAsfaTitle = (t) => ASFA_TITLES.has(t.replace(/\d+$/, '').toUpperCase());
      const titleFamily = (abbr) => {
        const base = abbr.replace(/\d+$/, '').toUpperCase();
        if (base === 'TCP' || base === 'CPX') return 'badge-t-tcp';
        if (base.endsWith('FCH')) return 'badge-t-fch';
        if (['LCI', 'LCC', 'VLCC', 'LCA', 'LCE'].includes(base)) return 'badge-t-lci';
        return 'badge-t-lcm';
      };
      const asfaTitles = dog.titles.filter(isAsfaTitle);

      const rankedBelow = dog.total_competing ? dog.total_competing - dog.rank : null;
      // Best of Breed and Best in Field cannot be won in the Singles stake or
      // an LCI division, so they are not headlined as this hound's record
      // there. Whatever ASFA prints in those columns is reported in the note
      // below instead, with where it was actually earned.
      const tiles = dog.is_breed
        ? [
            [dog.points, 'Top 20 points'],
            [dog.bob, 'Best of Breed'],
            [dog.bif, 'Best in Field'],
            [percentileLabel(dog), rankContext(dog)],
          ]
        : [
            [dog.points, 'Top 20 points'],
            [dog.total_competing ?? '—', 'hounds competing'],
            [percentileLabel(dog), rankContext(dog)],
          ];

      const movement = dog.movement;
      let movementLine = '';
      if (movement && !movement.new) {
        const rank = movement.rank_delta;
        const points = movement.points_delta;
        const parts = [];
        if (rank > 0) parts.push(`climbed ${rank} place${rank === 1 ? '' : 's'}`);
        else if (rank < 0) parts.push(`fell ${-rank} place${rank === -1 ? '' : 's'}`);
        else parts.push('held rank');
        if (points) parts.push(`gained ${points} point${points === 1 ? '' : 's'}`);
        movementLine = `${parts.join(' and ')} since ${formatDate(movement.since)}`;
      } else if (movement && movement.new) {
        movementLine = `New to the ${dog.breed} standings since ${formatDate(movement.since)}`;
      }

      main.innerHTML = `
        <nav class="text-sm text-asfa-text/70">
          <a href="browse.html" class="lnk">Standings</a> ›
          <a href="${breedUrl(dog.breed_slug)}" class="lnk">${esc(dog.breed)}</a>
        </nav>

        <section class="card">
          <div class="flex flex-wrap items-start gap-4">
            <div class="text-center shrink-0 w-24">
              <div class="rank-pill">#${dog.rank}</div>
              <div class="text-xs uppercase tracking-widest text-asfa-text/60 mt-1">${esc(rankContext(dog))}</div>
            </div>
            <div class="flex-1 min-w-[16rem]">
              <h1 class="font-display text-3xl text-asfa-text leading-tight">${esc(dog.call_name)}</h1>
              <p class="text-asfa-text/85">${esc(dog.registered_name)}</p>
              <p class="text-sm text-asfa-text/70 mt-1">
                <a href="${breedUrl(dog.breed_slug)}" class="lnk">${esc(dog.breed)}</a>
                ${dog.region ? ` · Region ${dog.region}` : ''}
                ${dog.provisional ? ' · <span class="badge badge-prov">provisional</span>' : ''}
              </p>
              <p class="text-sm mt-1">Owned by ${asfaOwners(dog, season)}</p>
              ${movementLine ? `<p class="text-sm mt-2">${movementBadge(movement)}
                <span class="text-asfa-text/70">${esc(movementLine)}</span></p>` : ''}
            </div>
            <div class="flex gap-2 no-print">
              <button id="card-btn" class="btn btn-primary">
                ${icon('share', 'mr-1')}Stat card</button>
            </div>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-5">
            ${tiles.map(([value, label]) =>
              `<div class="tile"><div class="tile-value">${value}</div><div class="tile-label">${label}</div></div>`).join('')}
          </div>
        </section>

        <section class="card" id="titles-card">
          <h2 class="card-title">Titles</h2>
          ${asfaTitles.length ? `
            <p class="text-sm">ASFA lure coursing:
              ${asfaTitles.map((t) => `<span class="badge ${titleFamily(t)}">${esc(t)}</span>`).join(' ')}</p>` : `
            <p class="text-sm text-asfa-text/70" id="titles-none">No ASFA lure coursing title registered.</p>`}
          <div id="titles-new"></div>
          <p class="text-xs text-asfa-text/55 mt-3">
            Read from the registered name as ASFA prints it on the standings. ASFA does not publish
            a hound's championship-point total, so there is no progress bar here; the
            <a href="titles.html" class="lnk">titles page</a> lists what was awarded this season.
          </p>
        </section>

        <section class="card">
          <h2 class="card-title">Standing</h2>
          ${dog.total_competing && dog.rank_by_points ? `
            <p class="text-sm">
              ASFA reports <strong>${competitorsLabel(dog, dog.total_competing)}</strong>
              competing so far in ${season.season}. Its Top 20 ranks ${esc(dog.call_name)}
              <strong>#${dog.rank}</strong>, a place the ${dog.points} point${dog.points === 1 ? '' : 's'}
              listed do not give: by points, ${esc(dog.call_name)} would be
              ${dog.rank_by_points}${ordinalSuffix(dog.rank_by_points)}. The rank is shown as ASFA
              prints it, so no standing is worked out from it.
            </p>` : dog.total_competing ? `
            <p class="text-sm">
              ASFA reports <strong>${competitorsLabel(dog, dog.total_competing)}</strong>
              competing so far in ${season.season}.
              Ranked <strong>#${dog.rank}</strong>, ${esc(dog.call_name)} stands in the
              <strong>${percentileLabel(dog)}</strong> of ${esc(sectionNoun(dog))}${
                rankedBelow > 0 ? `, ahead of ${rankedBelow} others` : ''}.
            </p>
            <div class="mt-3 h-3 bg-asfa-bg2 border border-asfa-border" role="img"
                 aria-label="Standing: ${percentileLabel(dog)}">
              <div class="h-full bg-asfa-accent" style="width: ${Math.max(1, Math.min(100, dog.percentile))}%"></div>
            </div>
            <div class="flex justify-between text-xs text-asfa-text/55 mt-1">
              <span>top</span><span>${dog.total_competing} competing</span>
            </div>` : `
            <p class="text-sm text-asfa-text/70">
              ASFA has not published a competitor count for ${esc(dog.breed)} this season,
              so a standing cannot be calculated.
            </p>`}
          ${dog.is_breed ? '' : `
            <p class="text-xs text-asfa-text/65 mt-2">
              ${dog.breed === 'Singles'
                ? `Hounds run alone in the Singles stake, and its winner is not eligible for Best of
                   Breed or Best in Field (Running Rules Ch. V §5(d), §11).`
                : `Best of Breed is contested between the breed stakes, which this division is not.`}
              ${dog.bob || dog.bif
                ? ` ASFA's row for ${esc(dog.call_name)} does list
                    ${dog.bob} BOB and ${dog.bif} BIF; those were earned in breed competition, so
                    they are not shown above as a ${esc(dog.breed)} record and are not counted
                    toward ${esc(dog.breed)} on any leaderboard or total.`
                : ''}
            </p>`}
        </section>

        <section class="card hidden" id="season-card" aria-labelledby="season-title"></section>

        ${alsoRanked.length ? `
        <section class="card">
          <h2 class="card-title">Also ranked this season</h2>
          <p class="text-xs text-asfa-text/60 mb-3">
            The same registered name and owner appear in another section. The Singles stake
            re-ranks hounds that also compete in their breed stake.
          </p>
          <div class="tbl-wrap"><table class="tbl">
            <thead><tr><th scope="col">Section</th><th scope="col">Listed as</th><th scope="col" class="num">Rank</th>
              <th scope="col" class="num">Points</th><th scope="col" class="num">BOB</th><th scope="col" class="num">BIF</th></tr></thead>
            <tbody>${alsoRanked.map((other) => `
              <tr>
                <td><a href="${breedUrl(other.breed_slug)}" class="lnk">${esc(other.breed)}</a></td>
                <td><a href="${dogUrl(other.id)}" class="lnk">${esc(other.call_name)}</a></td>
                <td class="num">${other.rank}</td>
                <td class="num">${other.points}</td>
                <td class="num">${awardCell(other, 'bob')}</td>
                <td class="num">${awardCell(other, 'bif')}</td>
              </tr>`).join('')}</tbody>
          </table></div>
        </section>` : ''}

        <section class="card">
          <h2 class="card-title">The rest of ${esc(sectionNoun(dog))}</h2>
          <div class="tbl-wrap"><table class="tbl">
            <thead><tr><th scope="col" class="num">Rank</th><th scope="col">Hound</th><th scope="col">Owner</th>
              <th scope="col" class="num">Points</th>
              ${dog.is_breed ? '<th scope="col" class="num">BOB</th><th scope="col" class="num">BIF</th>' : ''}
              <th scope="col" class="num">Standing</th></tr></thead>
            <tbody>${season.dogs
              .filter((d) => d.breed_slug === dog.breed_slug)
              .sort((a, b) => a.rank - b.rank)
              .map((other) => `
                <tr class="${other.id === dog.id ? 'bg-asfa-bg2 font-semibold' : ''}">
                  <td class="num">${other.rank}</td>
                  <td>${other.id === dog.id
                    ? esc(other.call_name)
                    : `<a href="${dogUrl(other.id)}" class="lnk">${esc(other.call_name)}</a>`}</td>
                  <td class="text-asfa-text/80">${asfaOwners(other, season)}</td>
                  <td class="num">${other.points}</td>
                  ${dog.is_breed
                    ? `<td class="num">${other.bob}</td><td class="num">${other.bif}</td>`
                    : ''}
                  <td class="num">${percentileLabel(other)}</td>
                </tr>`).join('')}</tbody>
          </table></div>
        </section>

        <p class="text-xs text-asfa-text/55">
          Figures as published by ASFA for January 1 through ${formatDate(season.as_of)}.
          The Top 20 lists roughly twenty hounds per breed, so these totals cover placings
          on that list — not a complete competition record.
          <a href="about.html" class="lnk">How this is built</a>.
        </p>`;

      // Points over the season, from every standings update this site has
      // kept; a problem with that file must not blank the profile.
      loadJson('data/season-history.json')
        .then((history) => paintSeason(document.getElementById('season-card'), dog, history))
        .catch((error) => console.warn(error));

      const button = document.getElementById('card-btn');
      if (button) button.addEventListener('click', () => openStatCard(dog, season));

      // Titles awarded this season come from ASFA's title listing, a
      // separate feed; a problem with it must not blank the profile.
      const profileIds = new Set([dog.id, ...alsoRanked.map((d) => d.id)]);
      fetch('data/titles.json')
        .then((response) => {
          if (!response.ok) throw new Error(`${response.status} loading data/titles.json`);
          return response.json();
        })
        .then((titles) => {
          const awarded = titles.titles
            .filter((row) => profileIds.has(row.dog_id))
            .sort((a, b) => a.date.localeCompare(b.date));
          if (!awarded.length) return;
          const none = document.getElementById('titles-none');
          if (none) none.textContent = 'ASFA has posted a title that the standings row does not carry yet.';
          document.getElementById('titles-new').innerHTML = `
            <p class="text-sm mt-2">Awarded this season:
              ${awarded.map((row) => `<span class="badge ${titleFamily(row.title_abbr)}">${esc(row.title_abbr)}</span>
                <span class="text-asfa-text/70">${esc(row.title.replace(/\s*\(.*\)$/, ''))}, ${formatDate(row.date)}</span>`).join('; ')}
            </p>`;
        })
        .catch((error) => console.warn(`Titles unavailable on the profile. ${error.message}`));
    });
  </script>
</body>
</html>
