<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2C6E49">
  <title>Hound profile — Lure Coursing Stats</title>
  <meta name="description" content="Season standing, Bowen points, Best of Breed and Best in Field record, and breed percentile for a hound ranked in the ASFA Top 20.">
  <link rel="preload" href="assets/fonts/fraunces-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
</head>
<body class="min-h-screen flex flex-col">
  <header id="site-header"></header>
  <main id="main" class="flex-1 max-w-5xl mx-auto w-full px-4 py-6 space-y-6"></main>
  <footer id="site-footer" class="bg-asfa-navy text-white py-8"></footer>

  <script src="js/app.js"></script>
  <script src="js/card.js"></script>
  <script>
    page('dog.html', (season) => {
      const main = document.getElementById('main');
      const id = param('id');
      const dog = season.dogs.find((d) => d.id === id);

      if (!dog) {
        main.innerHTML = `<div class="card">
          <h1 class="card-title">Hound not found</h1>
          <p class="text-sm">No hound in the ${season.season} standings matches
          <code>${esc(id || '(no id given)')}</code>.</p>
          <p class="text-sm mt-2"><a href="index.html" class="lnk">Search by name →</a></p>
        </div>`;
        return;
      }

      document.title = `${dog.call_name} — ${dog.breed} — Lure Coursing Stats`;

      // Other rows for the same hound: the Singles stake re-ranks hounds that
      // also appear under their breed.
      const alsoRanked = season.dogs.filter(
        (d) => d.hound_key === dog.hound_key && d.id !== dog.id
      );

      const rankedBelow = dog.total_competing ? dog.total_competing - dog.rank : null;
      // Best of Breed and Best in Field cannot be won in the Singles stake or
      // an LCI division, so they are not headlined as this hound's record
      // there. Whatever ASFA prints in those columns is reported in the note
      // below instead, with where it was actually earned.
      const tiles = dog.is_breed
        ? [
            [dog.points, 'Top 20 points'],
            [dog.bob, 'Best of Breed'],
            [dog.bif, 'Best in Field'],
            [percentileLabel(dog), rankContext(dog)],
          ]
        : [
            [dog.points, 'Top 20 points'],
            [dog.total_competing ?? '—', 'hounds competing'],
            [percentileLabel(dog), rankContext(dog)],
          ];

      const movement = dog.movement;
      let movementLine = '';
      if (movement && !movement.new) {
        const rank = movement.rank_delta;
        const points = movement.points_delta;
        const parts = [];
        if (rank > 0) parts.push(`climbed ${rank} place${rank === 1 ? '' : 's'}`);
        else if (rank < 0) parts.push(`fell ${-rank} place${rank === -1 ? '' : 's'}`);
        else parts.push('held rank');
        if (points) parts.push(`gained ${points} point${points === 1 ? '' : 's'}`);
        movementLine = `${parts.join(' and ')} since ${formatDate(movement.since)}`;
      } else if (movement && movement.new) {
        movementLine = `New to the ${dog.breed} standings since ${formatDate(movement.since)}`;
      }

      main.innerHTML = `
        <nav class="text-sm text-asfa-text/60">
          <a href="browse.html" class="lnk">Browse</a> ›
          <a href="${breedUrl(dog.breed_slug)}" class="lnk">${esc(dog.breed)}</a>
        </nav>

        <section class="card">
          <div class="flex flex-wrap items-start gap-4">
            <div class="text-center shrink-0 w-24">
              <div class="rank-pill">#${dog.rank}</div>
              <div class="text-xs uppercase tracking-widest text-asfa-text/60 mt-1">${esc(rankContext(dog))}</div>
            </div>
            <div class="flex-1 min-w-[16rem]">
              <h1 class="font-display text-3xl text-asfa-text leading-tight">${esc(dog.call_name)}</h1>
              <p class="text-asfa-text/85">${esc(dog.registered_name)}</p>
              <p class="text-sm text-asfa-text/70 mt-1">
                <a href="${breedUrl(dog.breed_slug)}" class="lnk">${esc(dog.breed)}</a>
                ${dog.region ? ` · Region ${dog.region}` : ''}
                ${dog.provisional ? ' · <span class="badge badge-prov">provisional</span>' : ''}
              </p>
              <p class="text-sm mt-1">Owned by ${dog.owners.map((owner) =>
                `<a href="${ownerUrl(owner.entity)}" class="lnk">${esc(owner.name)}</a>`).join(', ')
                || esc(dog.owner_raw)}</p>
              ${movementLine ? `<p class="text-sm mt-2">${movementBadge(movement)}
                <span class="text-asfa-text/70">${esc(movementLine)}</span></p>` : ''}
            </div>
            <div class="flex gap-2 no-print">
              <button id="card-btn" class="px-3 py-2 bg-asfa-green text-white text-sm hover:bg-asfa-greenHover">
                ${icon('share', 'mr-1')}Stat card</button>
            </div>
          </div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-5">
            ${tiles.map(([value, label]) =>
              `<div class="tile"><div class="tile-value">${value}</div><div class="tile-label">${label}</div></div>`).join('')}
          </div>
        </section>

        <section class="card">
          <h2 class="card-title">Standing</h2>
          ${dog.total_competing ? `
            <p class="text-sm">
              ASFA reports <strong>${competitorsLabel(dog, dog.total_competing)}</strong>
              competing so far in ${season.season}.
              Ranked <strong>#${dog.rank}</strong>, ${esc(dog.call_name)} stands in the
              <strong>${percentileLabel(dog)}</strong> of ${esc(sectionNoun(dog))}${
                rankedBelow > 0 ? `, ahead of ${rankedBelow} others` : ''}.
            </p>
            <div class="mt-3 h-3 bg-asfa-bg2 border border-asfa-border" role="img"
                 aria-label="Standing: ${percentileLabel(dog)}">
              <div class="h-full bg-asfa-accent" style="width: ${Math.max(1, Math.min(100, dog.percentile))}%"></div>
            </div>
            <div class="flex justify-between text-xs text-asfa-text/55 mt-1">
              <span>top</span><span>${dog.total_competing} competing</span>
            </div>` : `
            <p class="text-sm text-asfa-text/70">
              ASFA has not published a competitor count for ${esc(dog.breed)} this season,
              so a standing cannot be calculated.
            </p>`}
          ${dog.is_breed ? '' : `
            <p class="text-xs text-asfa-text/65 mt-2">
              ${dog.breed === 'Singles'
                ? `Hounds run alone in the Singles stake, and its winner is not eligible for Best of
                   Breed or Best in Field (Running Rules Ch. V §5(d), §11).`
                : `Best of Breed is contested between the breed stakes, which this division is not.`}
              ${dog.bob || dog.bif
                ? ` ASFA's row for ${esc(dog.call_name)} does list
                    ${dog.bob} BOB and ${dog.bif} BIF; those were earned in breed competition, so
                    they are not shown above as a ${esc(dog.breed)} record and are not counted
                    toward ${esc(dog.breed)} on any leaderboard or total.`
                : ''}
            </p>`}
        </section>

        ${alsoRanked.length ? `
        <section class="card">
          <h2 class="card-title">Also ranked this season</h2>
          <p class="text-xs text-asfa-text/60 mb-3">
            The same registered name and owner appear in another section. The Singles stake
            re-ranks hounds that also compete in their breed stake.
          </p>
          <div class="tbl-wrap"><table class="tbl">
            <thead><tr><th>Section</th><th>Listed as</th><th class="num">Rank</th>
              <th class="num">Points</th><th class="num">BOB</th><th class="num">BIF</th></tr></thead>
            <tbody>${alsoRanked.map((other) => `
              <tr>
                <td><a href="${breedUrl(other.breed_slug)}" class="lnk">${esc(other.breed)}</a></td>
                <td><a href="${dogUrl(other.id)}" class="lnk">${esc(other.call_name)}</a></td>
                <td class="num">${other.rank}</td>
                <td class="num">${other.points}</td>
                <td class="num">${awardCell(other, 'bob')}</td>
                <td class="num">${awardCell(other, 'bif')}</td>
              </tr>`).join('')}</tbody>
          </table></div>
        </section>` : ''}

        <section class="card">
          <h2 class="card-title">The rest of ${esc(sectionNoun(dog))}</h2>
          <div class="tbl-wrap"><table class="tbl">
            <thead><tr><th class="num">Rank</th><th>Hound</th><th>Owner</th>
              <th class="num">Points</th>
              ${dog.is_breed ? '<th class="num">BOB</th><th class="num">BIF</th>' : ''}
              <th class="num">Standing</th></tr></thead>
            <tbody>${season.dogs
              .filter((d) => d.breed_slug === dog.breed_slug)
              .sort((a, b) => a.rank - b.rank)
              .map((other) => `
                <tr class="${other.id === dog.id ? 'bg-asfa-bg2 font-semibold' : ''}">
                  <td class="num">${other.rank}</td>
                  <td>${other.id === dog.id
                    ? esc(other.call_name)
                    : `<a href="${dogUrl(other.id)}" class="lnk">${esc(other.call_name)}</a>`}</td>
                  <td class="text-asfa-text/80">${esc(other.owner_raw)}</td>
                  <td class="num">${other.points}</td>
                  ${dog.is_breed
                    ? `<td class="num">${other.bob}</td><td class="num">${other.bif}</td>`
                    : ''}
                  <td class="num">${percentileLabel(other)}</td>
                </tr>`).join('')}</tbody>
          </table></div>
        </section>

        <p class="text-xs text-asfa-text/55">
          Figures as published by ASFA for January 1 through ${formatDate(season.as_of)}.
          The Top 20 lists roughly twenty hounds per breed, so these totals cover placings
          on that list — not a complete competition record.
          <a href="about.html" class="lnk">How this is built</a>.
        </p>`;

      const button = document.getElementById('card-btn');
      if (button) button.addEventListener('click', () => openStatCard(dog, season));
    });
  </script>
</body>
</html>
