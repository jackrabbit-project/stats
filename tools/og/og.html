<!doctype html>
<!-- The share card (assets/og.png, 1200x630) as a page. Render it with
     tools/og/render.ps1, which screenshots this file in headless Chrome.
     Photo: Matt Schumitz Photography (credited on the card). -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Fraunces'; src: url('../../assets/fonts/fraunces-latin-var.woff2') format('woff2'); font-weight: 100 900; font-style: normal; }
  @font-face { font-family: 'Fraunces'; src: url('../../assets/fonts/fraunces-italic-latin-var.woff2') format('woff2'); font-weight: 100 900; font-style: italic; }
  @font-face { font-family: 'IBM Plex Mono'; src: url('../../assets/fonts/plex-mono-500.woff2') format('woff2'); font-weight: 500; }
  :root { --paper: #F7F5EF; --ink: #2B2A26; --muted: #6E6C64; --rust: #A44A2F; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
  body { position: relative; font-family: 'Fraunces', serif; color: var(--ink); }
  .photo {
    position: absolute; inset: 0 0 0 482px;
    clip-path: polygon(110px 0, 100% 0, 100% 100%, 0 100%);
    background: url('afghans.jpg') 40% 80% / 1060px auto no-repeat;
  }
  .credit {
    position: absolute; right: 14px; bottom: 12px;
    font: 500 13px/1 'IBM Plex Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase;
    color: #fff; background: rgb(0 0 0 / 0.6); padding: 5px 7px;
  }
  .text { position: absolute; left: 64px; top: 46px; width: 470px; }
  .mark { width: 64px; height: 66px; display: block; margin-bottom: 22px; }
  h1 {
    font-size: 90px; line-height: 0.92; font-weight: 600; letter-spacing: -0.02em;
    font-variation-settings: 'opsz' 144, 'SOFT' 0, 'WONK' 1;
  }
  .rule { width: 120px; height: 5px; background: var(--rust); margin: 24px 0 18px; }
  .tag { font-style: italic; font-size: 29px; line-height: 1.22; font-weight: 400; max-width: 400px; font-variation-settings: 'opsz' 72; }
  .tag span { display: block; }
  .chips { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; margin-top: 24px; }
  .row { display: flex; gap: 6px; }
  .lab { font: 500 13px/1 'IBM Plex Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .chip { font: 500 18px/1 'IBM Plex Mono', monospace; letter-spacing: 0.04em; color: #fff; padding: 6px 9px 5px; border-radius: 4px; }
  .asfa { background: #A44A2F; } .akc { background: #2B2A26; } .lgra { background: #3D5A80; }
  .aok9 { background: #2C6E49; } .notra { background: #8F6210; } .whip { background: #6E3D78; }
  .url { margin-top: 24px; font: 500 22px/1 'IBM Plex Mono', monospace; color: var(--rust); letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="photo"><span class="credit">Photo: Matt Schumitz Photography</span></div>
  <div class="text">
    <img class="mark" src="mark.svg" alt="">
    <h1>Gazehound<br>Stats</h1>
    <div class="rule"></div>
    <p class="tag"><span>Who's leading, who just titled,</span><span>and how the season's going.</span></p>
    <div class="chips">
      <span class="lab">Coursing</span>
      <span class="row"><span class="chip asfa">ASFA</span><span class="chip akc">AKC</span></span>
      <span class="lab">Racing</span>
      <span class="row"><span class="chip lgra">LGRA</span><span class="chip aok9">AOK9</span><span class="chip notra">NOTRA</span><span class="chip whip">WRA</span><span class="chip whip">CWA</span></span>
    </div>
    <div class="url">stats.gazehound.io</div>
  </div>
</body>
</html>
