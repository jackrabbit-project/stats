<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2C6E49">
  <title>Kennels — Lure Coursing Stats</title>
  <meta name="description" content="Which owners are having the strongest 2026 ASFA lure coursing season, by hounds ranked, Bowen points, Best of Breed and Best in Field.">
  <link rel="preload" href="assets/fonts/fraunces-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
</head>
<body class="min-h-screen flex flex-col">
  <header id="site-header"></header>
  <main id="main" class="flex-1 max-w-6xl mx-auto w-full px-4 py-6 space-y-6"></main>
  <footer id="site-footer" class="bg-asfa-navy text-white py-8"></footer>

  <script src="js/app.js"></script>
  <script>
    page('kennels.html', (season) => {
      const main = document.getElementById('main');
      const focusKey = param('owner');
      const focus = focusKey && season.owners.find((owner) => owner.key === focusKey);

      if (focus) {
        const dogs = season.dogs.filter((dog) => focus.dog_ids.includes(dog.id));
        // Same name, different person — K.Sanders is one owner in Region 8 and
        // a different owner in Region 1.
        const sharesName = season.owners.filter((owner) =>
          owner.owner_key === focus.owner_key && owner.key !== focus.key);
        document.title = `${focus.name} — Lure Coursing Stats`;

        main.innerHTML = `
          <nav class="text-sm text-asfa-text/70"><a href="kennels.html" class="lnk">Kennels</a> › ${esc(focus.name)}</nav>
          <section class="card">
            <h1 class="card-title">${esc(focus.name)}</h1>
            <p class="text-sm text-asfa-text/70">
              ${regionLabel(focus.region)} · ${focus.breeds.map((breed) => esc(breed)).join(' · ')}
            </p>
            ${sharesName.length ? `
              <p class="text-xs text-asfa-text/65 mt-2">
                Another owner of the same name appears in
                ${sharesName.map((o) => `<a href="${ownerUrl(o.key)}" class="lnk">${regionLabel(o.region)}</a>`).join(', ')}.
                ASFA publishes no owner identifier, so hounds are attributed by the region on each
                standings row. <a href="about.html" class="lnk">How this works</a>.
              </p>` : ''}
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4">
              <div class="tile"><div class="tile-value">${focus.hounds}</div><div class="tile-label">hounds ranked</div></div>
              <div class="tile"><div class="tile-value">${focus.points}</div><div class="tile-label">Top 20 points</div></div>
              <div class="tile"><div class="tile-value">${focus.bob}</div><div class="tile-label">Best of Breed</div></div>
              <div class="tile"><div class="tile-value">${focus.bif}</div><div class="tile-label">Best in Field</div></div>
            </div>
          </section>
          <section class="card">
            <h2 class="card-title">Hounds</h2>
            <div class="tbl-wrap"><table class="tbl">
              <thead><tr><th scope="col">Hound</th><th scope="col">Registered name</th><th scope="col">Breed</th>
                <th scope="col" class="num">Rank</th><th scope="col" class="num">Points</th>
                <th scope="col" class="num">BOB</th><th scope="col" class="num">BIF</th><th scope="col" class="num">Standing</th></tr></thead>
              <tbody>${dogs.sort((a, b) => b.points - a.points).map((dog) => `
                <tr>
                  <td><a href="${dogUrl(dog.id)}" class="lnk font-semibold">${esc(dog.call_name)}</a></td>
                  <td class="text-asfa-text/80">${esc(dog.registered_name)}</td>
                  <td><a href="${breedUrl(dog.breed_slug)}" class="lnk">${esc(dog.breed)}</a></td>
                  <td class="num">${dog.rank}</td>
                  <td class="num font-semibold">${dog.points}</td>
                  <td class="num">${awardCell(dog, 'bob')}</td>
                  <td class="num ${dog.is_breed && dog.bif ? 'font-semibold text-asfa-accent' : ''}">${awardCell(dog, 'bif')}</td>
                  <td class="num">${percentileLabel(dog)}</td>
                </tr>`).join('')}</tbody>
            </table></div>
            <p class="text-xs text-asfa-text/55 mt-3">
              Co-owned hounds are listed under every owner named on the ASFA row, so totals
              across owners add to more than the season total.
            </p>
          </section>`;
        return;
      }

      const sortable = [
        ['points', 'Points'], ['hounds', 'Hounds'],
        ['bob', 'BOB'], ['bif', 'BIF'], ['firsts', 'Firsts'],
      ];
      let sortKey = 'points';
      let query = '';

      /* The table shows a Top 50, which leaves 325 of the 375 owners with no
         route to their own page. Search covers the whole list.

         ASFA publishes owners as an initial and a surname ("J. & K.Hicks"), so
         match on surname: typing "hicks" finds them, "jane hicks" never could. */
      function matches(owner) {
        if (!query) return true;
        return owner.name.toLowerCase().includes(query);
      }

      function ownerTable() {
        const found = season.owners.filter(matches);
        const owners = [...found]
          .sort((a, b) => b[sortKey] - a[sortKey] || b.points - a.points)
          .slice(0, query ? 200 : 50);

        if (!owners.length) {
          return `<p class="text-sm text-asfa-text/70 py-3">
            No owner matching “${esc(query)}”. ASFA publishes owners as an initial and a surname,
            so try the surname on its own.
          </p>`;
        }

        return `
          <div class="tbl-wrap"><table class="tbl">
            <thead><tr>
              <th scope="col">Owner</th><th scope="col" class="num">Region</th><th scope="col">Breeds</th>
              ${sortable.map(([key, label]) =>
                `<th scope="col" class="sortable num" ${key === sortKey ? 'aria-sort="descending"' : ''}>
                  <button type="button" class="th-btn" data-key="${key}">${label}${
                    key === sortKey ? icon('chevronDown') : ''}</button></th>`).join('')}
            </tr></thead>
            <tbody>${owners.map((owner) => `
              <tr>
                <td><a href="${ownerUrl(owner.key)}" class="lnk font-semibold">${esc(owner.name)}</a></td>
                <td class="num">${owner.region ?? '—'}</td>
                <td class="text-asfa-text/75 text-xs">${owner.breeds.slice(0, 3).map(esc).join(', ')}${
                  owner.breeds.length > 3 ? ` +${owner.breeds.length - 3}` : ''}</td>
                <td class="num font-semibold">${owner.points}</td>
                <td class="num">${owner.hounds}</td>
                <td class="num">${owner.bob}</td>
                <td class="num ${owner.bif ? 'font-semibold text-asfa-accent' : ''}">${owner.bif}</td>
                <td class="num">${owner.firsts}</td>
              </tr>`).join('')}</tbody>
          </table></div>`;
      }

      function caption() {
        const sorted = esc(sortable.find(([k]) => k === sortKey)[1].toLowerCase());
        if (!query) return `Top 50 by ${sorted}.`;
        const n = season.owners.filter(matches).length;
        return `${n} owner${n === 1 ? '' : 's'} matching “${esc(query)}”, by ${sorted}.`;
      }

      function paint() {
        main.innerHTML = `
          <div>
            <h1 class="font-display text-3xl text-asfa-text">Kennels</h1>
            <p class="text-sm text-asfa-text/70 mt-1">
              ${season.season} season through ${formatDate(season.as_of)}.
              Owner is the only ownership field ASFA publishes, so these are owning parties
              rather than kennel prefixes.
            </p>
          </div>

          <section class="card">
            <h2 class="card-title">Owners</h2>
            <label class="block mb-3">
              <span class="sr-only">Search owners by name</span>
              <input id="owner-search" type="search" autocomplete="off"
                     value="${esc(query)}"
                     placeholder="Search all ${season.owners.length} owners by surname…"
                     class="w-full border border-asfa-border px-3 py-2 focus:outline-none focus:ring-2 focus:ring-asfa-green">
            </label>
            <div id="owner-table">${ownerTable()}</div>
            <p class="text-xs text-asfa-text/55 mt-3">
              <span id="owner-caption">${caption()}</span>
              A co-owned hound counts for every owner named on the row. Points are summed across
              breeds, which mixes scales — treat the hound and BIF columns as the sturdier measures.
            </p>
          </section>

          <p class="text-sm">
            <a href="regions.html" class="lnk">Standings and trial entries by region →</a>
          </p>`;

        wireTable();

        /* Typing must not go through paint(): rewriting main would replace the
           input mid-keystroke and drop the caret. Redraw the table only. */
        main.querySelector('#owner-search').addEventListener('input', (event) => {
          query = event.target.value.trim().toLowerCase();
          redrawTable();
        });
      }

      function redrawTable() {
        main.querySelector('#owner-table').innerHTML = ownerTable();
        main.querySelector('#owner-caption').innerHTML = caption();
        wireTable();
      }

      // Header sorting is re-bound after every table redraw.
      function wireTable() {
        main.querySelectorAll('button[data-key]').forEach((btn) => {
          btn.addEventListener('click', () => { sortKey = btn.dataset.key; redrawTable(); });
        });
      }

      paint();
    });
  </script>
</body>
</html>
